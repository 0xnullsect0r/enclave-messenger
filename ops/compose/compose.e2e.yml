# CI only (ci/federation): three stacks on one host. Each stack's witness
# joins a shared `federation` network under its stack's name, so servers
# reach the other stacks' witnesses directly (plain HTTP, as a front would
# proxy them). The front serves a certificate from the test's CA; the push
# relay reaches the test's UnifiedPush endpoint on the host, and the
# credential gate the credential proxy stand-in there.
#
#   docker compose -p a -f compose.yml -f compose.dev.yml -f compose.e2e.yml up -d

services:
  witness:
    networks:
      backend: {}
      federation:
        aliases: ["witness-${STACK}"]
  server:
    networks: [backend, egress, federation]
  front:
    environment:
      ENCLAVE_FRONT__TLS: files
    volumes:
      - ./tls:/etc/enclave/tls:ro
  push-relay:
    extra_hosts: ["host.docker.internal:host-gateway"]
  # Stack a over the local mixnet: the gate's proxy is enclave-dev-proxy on
  # the host.
  credgate:
    extra_hosts: ["host.docker.internal:host-gateway"]
  # The stacks run the images this commit built, not a release.
  updater:
    profiles: [updater]

networks:
  federation:
    external: true
    name: enclave-federation
