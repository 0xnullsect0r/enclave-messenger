# Development: reach the server directly over TCP (the dev transport) with
# a self-signed front. Never on the internet: production servers are
# reached only through their onion service (or Nym ingress).
#
#   docker compose -f compose.yml -f compose.dev.yml up -d

services:
  server:
    ports:
      - "127.0.0.1:${SERVER_PORT:-7443}:7443"
    networks: [backend, egress, dev]
  front:
    environment:
      ENCLAVE_FRONT__TLS: self-signed
  # Over TCP the stack needs no Tor or Nym clients (`--profile onion` and
  # `--profile nym` add them), and a development stack isn't updated
  # behind its developer's back.
  onion:
    profiles: [onion]
  push-egress:
    profiles: [onion]
  push-onion:
    profiles: !override [push-tor]
  updater:
    profiles: [updater]

networks:
  dev: {}
