[package]
name = "xtask"
description = "Enclave repository tasks (label registry checks, budgets, packaging)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
enclave-crypto = { path = "../crates/enclave-crypto" }
resvg = { version = "0.48", default-features = false }
serde_json = "1"
# Release archives and checksums (dist.rs).
tar = "0.4"
flate2 = "1"
crc32fast = "1"
sha2 = "0.10"
sha3 = "0.10"
