[workspace]
exclude = ["fuzz"]
resolver = "3"
members = [
    "crates/enclave-crypto",
    "crates/enclave-wire",
    "crates/enclave-proto",
    "crates/enclave-rpc",
    "crates/enclave-tokens",
    "crates/enclave-kt",
    "crates/enclave-server",
    "crates/enclave-sim",
    "crates/enclave-net",
    "crates/enclave-store",
    "crates/enclave-core",
    "crates/enclave-ipc",
    "crates/enclave-vault",
    "crates/enclave-sandbox",
    "crates/enclave-platform",
    "crates/enclave-nse",
    "crates/enclave-wasmbox",
    "crates/enclave-update",
    "crates/enclave-crash",
    "crates/enclave-netd",
    "crates/enclave-av1",
    "crates/enclave-media",
    "crates/enclave-mediad",
    "crates/enclave-push-relay",
    "crates/enclave-slip39",
    "crates/enclave-design",
    "crates/enclave-app",
    "crates/enclave-calls",
    "crates/enclave-relay",
    "crates/enclave-service",
    "crates/enclave-federation",
    "crates/enclave-admin",
    "crates/enclave-tls",
    "crates/enclave-witness",
    "crates/enclave-credgate",
    "crates/enclave-front",
    "crates/enclave-e2e",
    "crates/enclave-fuzz",
    "crates/enclave-nym",
    "crates/enclave-ingress",
    "crates/enclave-tord",
    "xtask",
]

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.94"
license = "GPL-3.0-only"
repository = "https://github.com/0xnullsect0r/enclave-messenger"
authors = ["The Enclave contributors"]
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "allow"
unused_must_use = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
indexing_slicing = "allow"
dbg_macro = "deny"
todo = "deny"
too_many_arguments = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
overflow-checks = true

# Constant time (`docs/02-cryptography.md` §12, RT-15): the cryptographic
# crates are written for wrapping arithmetic, and an overflow check is a
# branch on the values it checks. On secrets those branches are never
# taken but still depend on the secret, which ctgrind
# (`crates/enclave-crypto/tests/ctgrind.rs`) reports; so these crates,
# and enclave-crypto (where fiat-crypto's field arithmetic is inlined),
# are built without them.
[profile.release.package.enclave-crypto]
overflow-checks = false

[profile.release.package.classic-mceliece-rust]
overflow-checks = false

[profile.release.package.fiat-crypto]
overflow-checks = false

[profile.release.package.libcrux-ml-kem]
overflow-checks = false

[profile.release.package.libcrux-ml-dsa]
overflow-checks = false

[profile.release.package.libcrux-sha3]
overflow-checks = false

[profile.release.package.libcrux-intrinsics]
overflow-checks = false

[profile.release.package.libcrux-secrets]
overflow-checks = false

[profile.release.package.ed448-goldilocks]
overflow-checks = false

[profile.release.package.crypto-bigint]
overflow-checks = false

[profile.release.package.chacha20]
overflow-checks = false

[profile.release.package.aes]
overflow-checks = false

[profile.release.package.ctr]
overflow-checks = false

[profile.release.package.sha3]
overflow-checks = false

[profile.release.package.keccak]
overflow-checks = false

[profile.release.package.subtle]
overflow-checks = false

[profile.release.package.slh-dsa]
overflow-checks = false

[profile.release.package.curve25519-dalek]
overflow-checks = false

[profile.release.package.x25519-dalek]
overflow-checks = false

[profile.release.package.cshake]
overflow-checks = false

[profile.release.package.argon2]
overflow-checks = false

[profile.release.package.blake2]
overflow-checks = false

[profile.test]
opt-level = 2

# Our own crates optimized in development builds too: unoptimized, the
# vault's account setup (key generation, proofs of work) takes minutes, so
# `cargo run -p enclave-app` looked frozen and the launcher test timed out
# whenever it picked up a plain `cargo build` of the vault.
[profile.dev]
opt-level = 2

[profile.dev.package."*"]
opt-level = 2

# The video codecs check themselves in their hot loops: with debug
# assertions a call's frames take seconds each in tests.
[profile.dev.package.rav1e]
opt-level = 3
debug-assertions = false
overflow-checks = false

[profile.dev.package.rav1d]
opt-level = 3
debug-assertions = false
overflow-checks = false

# Upstream crates built with a small change (third_party/PATCHES.md).
[patch.crates-io]
ptrs = { path = "third_party/ptrs" }
classic-mceliece-rust = { path = "third_party/classic-mceliece-rust" }
i-slint-backend-android-activity = { path = "third_party/i-slint-backend-android-activity" }
rav1d = { path = "third_party/rav1d" }
candle-core = { path = "third_party/candle-core" }
