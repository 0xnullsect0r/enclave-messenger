<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- The back of a letter in Pine: its flap folded down and held by a
       Saffron seal (the Seal of docs/17-design.md §4). Desktop and store
       icon; the platforms round or mask it. -->
  <defs>
    <clipPath id="card"><rect x="64" y="64" width="896" height="896" rx="200"/></clipPath>
  </defs>
  <g clip-path="url(#card)">
    <rect x="64" y="64" width="896" height="896" fill="#1D5646"/>
    <path d="M 64 64 L 960 64 L 960 236 L 512 596 L 64 236 Z" fill="#327D66"/>
  </g>
  <circle cx="512" cy="596" r="176" fill="#F2B230"/>
  <circle cx="512" cy="596" r="122" fill="none" stroke="#D8961D" stroke-width="20"/>
</svg>
