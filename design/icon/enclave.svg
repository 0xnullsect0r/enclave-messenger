  </defs>
  <g clip-path="url(#card)">
    <rect x="64" y="64" width="896" height="896" fill="#1D5646"/>
    <path d="M 64 64 L 960 64 L 960 236 L 512 596 L 64 236 Z" fill="#327D66"/>
  </g>
  <circle cx="512" cy="596" r="176" fill="#F6F3EC"/>
  <circle cx="512" cy="596" r="122" fill="none" stroke="#D6CFC0" stroke-width="20"/>
</svg>
