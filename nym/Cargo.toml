# The parts of Enclave that link nym-sdk, in a workspace of their own:
# nym-sdk and arti (Tor, in the main workspace) need different SQLite
# versions, so they can't share a lockfile. Each runs in its own process
# anyway (docs/09-transport.md §1, docs/spikes/m4-network.md).
[workspace]
resolver = "3"
members = ["enclave-nym-sdk", "enclave-ingress-bin", "enclave-nymd", "enclave-dev-proxy", "enclave-mobile"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "GPL-3.0-only"
repository = "https://github.com/0xnullsect0r/enclave-messenger"
authors = ["The Enclave contributors"]
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

# third_party/PATCHES.md
[patch.crates-io]
nym-client-core = { path = "../third_party/nym-client-core" }
nym-gateway-client = { path = "../third_party/nym-gateway-client" }
nym-gateway-requests = { path = "../third_party/nym-gateway-requests" }
nym-credential-storage = { path = "../third_party/nym-credential-storage" }
libsqlite3-sys = { path = "../third_party/libsqlite3-sys-030" }
i-slint-backend-android-activity = { path = "../third_party/i-slint-backend-android-activity" }
opus-decoder = { path = "../third_party/opus-decoder" }
rav1d = { path = "../third_party/rav1d" }
