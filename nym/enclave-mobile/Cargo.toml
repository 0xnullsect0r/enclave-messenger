[package]
name = "enclave-mobile"
description = "Enclave on Android and iOS: the app with its vault and helpers in one process."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

# The workspace forbids `unsafe`; this crate needs it for a few marked
# places: the entry points Android looks up by name (android_main and the
# `Native` class's methods), and setting the proxy variables once at start.
[lints.rust]
unsafe_code = "deny"
missing_docs = "deny"

[lib]
# Android loads libenclave_mobile.so; the rlib serves the iOS program.
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "enclave-ios"
path = "src/bin/enclave-ios.rs"

[dependencies]
enclave-app = { path = "../../crates/enclave-app" }
enclave-crypto = { path = "../../crates/enclave-crypto" }
enclave-mediad = { path = "../../crates/enclave-mediad" }
enclave-netd = { path = "../../crates/enclave-netd" }
enclave-platform = { path = "../../crates/enclave-platform" }
enclave-tord = { path = "../../crates/enclave-tord" }
enclave-vault = { path = "../../crates/enclave-vault" }
enclave-crash = { path = "../../crates/enclave-crash" }
enclave-nymd = { path = "../enclave-nymd" }
slint = { version = "1.18", default-features = false }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
# liblyrebird.so (Snowflake and WebTunnel), loaded from the APK.
libloading = "0.8"

# The media process as WebAssembly in an interpreter (iOS's sandbox).
[target.'cfg(target_os = "ios")'.dependencies]
enclave-wasmbox = { path = "../../crates/enclave-wasmbox" }
