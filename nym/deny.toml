    "borsh",
    "camino",
    "clang-sys",
    "classic-mceliece-rust",
    "core-foundation-sys",  # links CoreFoundation (camera, via nokhwa on macOS)
    "cpal",
    "crabgrind",  # constant-time tests under valgrind only (cfg(valgrind_ct_test))
    "crc32fast",
