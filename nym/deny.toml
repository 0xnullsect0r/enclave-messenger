# cargo-deny configuration for the nym/ workspace: the main one
# (../deny.toml), plus what nym-sdk 1.21.5 brings. These crates build only
# into enclave-ingress (and the client's mixnet process), never into a
# process holding Enclave keys. See ../third_party/PATCHES.md.

[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"
# Vulnerabilities fail everywhere. "Unmaintained" notices fail for our direct
# dependencies only; transitive ones (today proc-macro-error2 and ttf-parser,
# both via Slint) are tracked upstream rather than blocking CI.
unmaintained = "workspace"
ignore = [
    # Marvin attack on RSA private-key operations. `rsa` arrives only through
    # arti (the `tor` feature), which uses it for public-key checks of Tor
    # relay identities; Enclave never holds or uses an RSA private key.
    { id = "RUSTSEC-2023-0071", reason = "no RSA private-key operations anywhere in Enclave; public-key use via arti only" },
    # rustls-webpki 0.101 and h2 0.3 arrive only through reqwest 0.11 in
    # tendermint-rpc (cosmrs), nym's client for the Nyx chain, used for
    # credentials. The gateway connection itself is on rustls 0.23 (our
    # tungstenite 0.24 patch). Name-constraint bypasses need a misissuing
    # constrained CA; Enclave uses no CRLs; the h2 issue lets a malicious
    # RPC endpoint exhaust memory (denial of service only). Leaves with a
    # nym-sdk on reqwest 0.12.
    { id = "RUSTSEC-2026-0098", reason = "rustls-webpki 0.101 only in nym's Nyx RPC client; see above" },
    { id = "RUSTSEC-2026-0099", reason = "rustls-webpki 0.101 only in nym's Nyx RPC client; see above" },
    { id = "RUSTSEC-2026-0104", reason = "CRL parsing; no CRLs are used" },
    { id = "RUSTSEC-2026-0258", reason = "h2 0.3 only in nym's Nyx RPC client; denial of service only" },
    # rustls 0.21 comes through the same reqwest 0.11 (fixed only in 0.23.46,
    # which the rest of the tree uses). No ClientSessionStore of ours formats
    # session values with Debug, and rustls 0.21 offers no post-quantum
    # group to downgrade from.
    { id = "RUSTSEC-2026-0346", reason = "rustls 0.21 only in nym's Nyx RPC client; session values are never Debug-formatted" },
    { id = "RUSTSEC-2026-0349", reason = "rustls 0.21 only in nym's Nyx RPC client; it has no post-quantum group to lose" },
    # libcrux-kem 0.0.9 panics on short hybrid-KEM seeds and short hybrid
    # keys. It arrives only through libcrux-psq 0.0.10 (which pins =0.0.9)
    # in nym-crypto, which uses nothing of libcrux-psq but its X25519 key
    # types and their conversions: no hybrid KEM is encapsulated or decoded
    # anywhere in Enclave's tree. Leaves with a nym-crypto on libcrux-psq
    # 0.0.11.
    { id = "RUSTSEC-2026-0330", reason = "hybrid-KEM encapsulation in libcrux-kem 0.0.9 is never called; see above" },
    { id = "RUSTSEC-2026-0331", reason = "hybrid-KEM key decoding in libcrux-kem 0.0.9 is never called; see above" },
]

[licenses]
version = 2
confidence-threshold = 0.9
# GPLv3-compatible licenses only. AGPL is never allowed (App Store §7 plan).
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "CC0-1.0",
    "OFL-1.1",
    "GPL-3.0-only",
    "GPL-3.0-or-later",
    "LGPL-3.0-or-later",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    # Public-domain dedication (async_executors, via arti).
    "Unlicense",
    # equix and hashx (Equi-X proof of work, from the Tor Project). GPLv3
    # compatible, but LGPL-3.0's installation-information terms are a risk
    # for App Store builds that our section 7 permission cannot waive for
    # third-party code. Tracked in legal/ADDITIONAL-PERMISSIONS.md.
    "LGPL-3.0-only",
]
# Per-crate exceptions: allowed for that crate only.
exceptions = [
    # jpeg-encoder's forward DCT is ported from the IJG code (via mozjpeg).
    # The IJG license is free and GPL-compatible; binaries must say "this
    # software is based in part on the work of the Independent JPEG Group"
    # (README "Acknowledgements", and LICENSES/IJG-jpeg-encoder.txt).
    { allow = ["IJG"], crate = "jpeg-encoder" },
    # libFuzzer's NCSA licence. Only rav1e's `cfg(fuzzing)` builds pull it
    # in (and our own fuzz harness); never part of a shipped build.
    { allow = ["NCSA"], crate = "libfuzzer-sys" },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Path dependencies between our own (unpublished) workspace crates.
allow-wildcard-paths = true
# Crates that compile C, C++ or assembly must be listed here with a reason.
# Test-only oracles (openssl-sys) are dev-dependencies and never shipped.

# Every third-party build script must be listed (RT-14: rt14_build_rs_allowlist_enforced).
# Those that can compile or link native code carry a reason; the rest only
# probe the compiler (version and cfg detection) or generate Rust code.
[bans.build]
include-dependencies = true
# libloading ships two Windows test DLLs in its crate archive; they are
# test fixtures only and never linked. Pinned by checksum.
bypass = [
    { crate = "libloading", allow = [
        { path = "tests/nagisa32.dll", checksum = "5c69b2bd9c8a6ad04165c221075fc9fade1dd66ca697399ace528a5a62328e36" },
        { path = "tests/nagisa64.dll", checksum = "e20b95e3036f3289421abd100760874d4f455afd33c3b5b64fec56b191f7d477" },
    ] },
]
allow-build-scripts = [
    # Our own crates from the main workspace, which the phone app
    # (enclave-mobile) builds here: their build scripts set cfgs and write
    # the Windows resource; checked in the main workspace.
    # The app's call audio (cpal), as in the main workspace: cpal's script
    # sets target cfgs; alsa-sys links the system's ALSA on a Linux host.
    # nym-sdk 1.21.5 (nym/ workspace only): nym crates' build scripts set up
    # sqlx's offline query checks and version info (vergen); aws-lc-sys is
    # rustls's default C crypto there; blake3 and snow pick SIMD paths;
    # the rest are platform probes and code generation.
    # The app and its desktop helpers, built here too for Android and iOS
    # (enclave-mobile), with the same reasons as ../deny.toml.
    "ahash",
    "akd_core",
    "alsa-sys",
    "android-activity",  # Android entry point (Slint backend)
    "anyhow",
    "ash",
    "async-io",
    "async_executors",
    "atomic-polyfill",  # target-atomics cfg; obfs4 bridges (enclave-tord)
    "av-scenechange",  # rav1e scene detection; asm off
    "aws-lc-rs",
    "aws-lc-sys",
    "bindgen",
