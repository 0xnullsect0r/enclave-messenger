[package]
name = "enclave-dev-proxy"
description = "A stand-in for nym-credential-proxy with its own signers, for tests and the local mixnet."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
nym-compact-ecash = "=1.21.5"
nym-credential-proxy-requests = { version = "=1.21.5", default-features = false }
nym-credentials-interface = "=1.21.5"
nym-ecash-time = "=1.21.5"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "signal"] }
