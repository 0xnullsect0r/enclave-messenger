[package]
name = "enclave-e2e"
description = "End-to-end test driver: headless Enclave clients against real, separately run server stacks (the federation CI job)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
enclave-core = { path = "../enclave-core" }
enclave-crypto = { path = "../enclave-crypto" }
enclave-federation = { path = "../enclave-federation" }
enclave-net = { path = "../enclave-net", features = ["nym", "dev-transport"] }
enclave-nym = { path = "../enclave-nym" }
enclave-tord = { path = "../enclave-tord", default-features = false, features = ["launch"] }
enclave-push-relay = { path = "../enclave-push-relay" }
enclave-rpc = { path = "../enclave-rpc" }
async-trait = "0.1"
enclave-service = { path = "../enclave-service" }
enclave-store = { path = "../enclave-store" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "process"] }
