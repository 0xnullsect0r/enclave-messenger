[package]
name = "enclave-tokens"
description = "Enclave anti-abuse primitives: single-use write tokens and an Equihash proof of work."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
enclave-crypto = { path = "../enclave-crypto" }
blake2 = "0.10.6"
subtle = "2.6.1"
p384 = { version = "0.13", default-features = false, features = ["hash2curve", "voprf"] }
sha2 = "0.10"
voprf = { version = "0.5", default-features = false }
zeroize = "1.9.0"

[dev-dependencies]
# Secret poisoning under Valgrind (`privpass::ctgrind`).
enclave-platform = { path = "../enclave-platform", features = ["ctgrind"] }
