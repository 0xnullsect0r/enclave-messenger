[package]
name = "enclave-platform"
description = "Platform code for Enclave that needs `unsafe`: data-independent timing (AArch64 DIT) and locked memory for long-term secrets. A declared exception to the workspace's ban on unsafe code."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

# Not the workspace lints: those forbid `unsafe`, which this crate exists
# to hold. Every unsafe block carries a SAFETY comment.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "allow"
unused_must_use = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "deny"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
dbg_macro = "deny"
todo = "deny"

[dependencies]
zeroize = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Console", "Win32_System_Memory", "Win32_System_SystemInformation"] }
