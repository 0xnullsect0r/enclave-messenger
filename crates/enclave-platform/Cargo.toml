[package]
name = "enclave-platform"
description = "Platform code for Enclave that needs `unsafe`: data-independent timing (AArch64 DIT) and locked memory for long-term secrets. A declared exception to the workspace's ban on unsafe code."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

# Not the workspace lints: those forbid `unsafe`, which this crate exists
# to hold. Every unsafe block carries a SAFETY comment.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "allow"
unused_must_use = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "deny"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
dbg_macro = "deny"
todo = "deny"

[features]
# The platform keystores (`keystore`): the vault turns this on; the crypto
# crate, which also depends on this one, doesn't.
keystores = ["dep:security-framework", "dep:oo7", "dep:pollster", "dep:jni", "dep:ndk-context"]
# Window shims (`window`): the app turns this on.
window = ["dep:raw-window-handle", "dep:objc2", "dep:zbus"]
# Touch ID and Windows Hello for the app lock (`biometric`): the vault's.
biometric = ["dep:objc2", "dep:objc2-local-authentication", "dep:objc2-foundation", "dep:block2", "dep:windows", "dep:windows-future"]
# Android and iOS services for the app (`phone`): file pickers, the camera
# for codes, notifications, the clipboard, screen security. The app turns
# this on; on Android it also gives the keystore its Android Keystore.
phone = ["dep:jni", "dep:ndk-context", "dep:objc2", "dep:objc2-foundation", "dep:objc2-ui-kit", "dep:objc2-user-notifications", "dep:objc2-av-foundation", "dep:objc2-core-media", "dep:objc2-core-video", "dep:objc2-uniform-type-identifiers", "dep:block2", "dep:dispatch2"]

[dependencies]
zeroize = "1"
pollster = { version = "0.4", optional = true }
raw-window-handle = { version = "0.6", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = { version = "3", optional = true, features = ["OSX_10_15"] }
objc2 = { version = "0.6", optional = true }
objc2-local-authentication = { version = "0.3", optional = true, default-features = false, features = ["std", "block2", "LAContext", "LAError"] }
objc2-foundation = { version = "0.3", optional = true, default-features = false, features = ["std", "NSString", "NSError"] }
block2 = { version = "0.6", optional = true }

# iOS: the Keychain (with Secure Enclave keys) and UIKit.
[target.'cfg(target_os = "ios")'.dependencies]
security-framework = { version = "3", optional = true }
objc2 = { version = "0.6", optional = true }
objc2-foundation = { version = "0.3", optional = true, default-features = false, features = ["std", "block2", "NSString", "NSError", "NSArray", "NSURL", "NSData", "NSDate", "NSDictionary", "NSNotification", "NSOperation", "NSObject", "NSFileManager", "NSValue", "NSPathUtilities", "NSEnumerator"] }
objc2-ui-kit = { version = "0.3", optional = true, default-features = false, features = ["std", "block2", "UIApplication", "UIResponder", "UIView", "UIWindow", "UIViewController", "UIScreen", "UIPasteboard", "UIDocumentPickerViewController", "UIVisualEffectView", "UIVisualEffect", "UIBlurEffect", "UIScene", "UIWindowScene", "objc2-uniform-type-identifiers", "objc2-core-foundation"] }
objc2-user-notifications = { version = "0.3", optional = true, default-features = false, features = ["std", "block2", "UNUserNotificationCenter", "UNNotificationRequest", "UNNotificationContent", "UNNotificationSound", "UNNotificationTrigger", "UNNotification"] }
objc2-av-foundation = { version = "0.3", optional = true, default-features = false, features = ["std", "block2", "dispatch2", "objc2-core-media", "objc2-core-video", "AVCaptureSession", "AVCaptureDevice", "AVCaptureInput", "AVCaptureOutputBase", "AVCaptureVideoDataOutput", "AVMediaFormat"] }
objc2-core-media = { version = "0.3", optional = true, default-features = false, features = ["std", "objc2-core-video", "CMSampleBuffer"] }
objc2-core-video = { version = "0.3", optional = true, default-features = false, features = ["std", "CVBuffer", "CVImageBuffer", "CVPixelBuffer", "CVReturn"] }
objc2-uniform-type-identifiers = { version = "0.3", optional = true, default-features = false, features = ["std", "UTType", "UTCoreTypes"] }
block2 = { version = "0.6", optional = true }
dispatch2 = { version = "0.3", optional = true, default-features = false, features = ["std", "objc2"] }

# Android: JNI to the app's activity (apps/android, EnclaveActivity).
[target.'cfg(target_os = "android")'.dependencies]
jni = { version = "0.21", optional = true }
ndk-context = { version = "0.1", optional = true }

# Linux and the BSDs: the Secret Service (or, in a Flatpak, the secret
# portal). async-io rather than tokio, like the file dialogs' portal client,
# so neither needs a tokio runtime.
[target.'cfg(all(unix, not(any(target_os = "macos", target_os = "ios", target_os = "android"))))'.dependencies]
oo7 = { version = "0.6", optional = true, default-features = false, features = ["async-std", "native_crypto"] }
zbus = { version = "5", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-future = { version = "0.3", optional = true }
windows = { version = "0.62", optional = true, features = ["Security_Credentials_UI", "Win32_Foundation", "Win32_System_WinRT", "Foundation"] }
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Cryptography", "Win32_Security_Isolation", "Win32_System_Console", "Win32_System_Pipes", "Win32_System_Threading", "Win32_System_Memory", "Win32_System_SystemInformation", "Win32_System_Registry", "Win32_UI_WindowsAndMessaging"] }
