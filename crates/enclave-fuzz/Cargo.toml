[package]
name = "enclave-fuzz"
description = "Fuzz targets for every Enclave parser, and a seeded mutation smoke test that runs them in CI."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
enclave-crypto = { path = "../enclave-crypto" }
enclave-wire = { path = "../enclave-wire" }
enclave-federation = { path = "../enclave-federation" }
enclave-proto = { path = "../enclave-proto" }
enclave-rpc = { path = "../enclave-rpc" }
enclave-kt = { path = "../enclave-kt" }
enclave-ipc = { path = "../enclave-ipc" }
enclave-media = { path = "../enclave-media", features = ["av1"] }
enclave-server = { path = "../enclave-server" }
enclave-core = { path = "../enclave-core" }
enclave-calls = { path = "../enclave-calls" }
enclave-relay = { path = "../enclave-relay" }
enclave-nym = { path = "../enclave-nym" }
enclave-tokens = { path = "../enclave-tokens" }
enclave-push-relay = { path = "../enclave-push-relay" }
enclave-store = { path = "../enclave-store" }

[dev-dependencies]
png = "0.18"
jpeg-encoder = "0.7"
