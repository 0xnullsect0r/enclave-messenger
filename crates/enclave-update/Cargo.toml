[package]
name = "enclave-update"
description = "Enclave's update channel: TUF-shaped release metadata co-signed by 2 of 3 maintainers (SLH-DSA + composite), and Sigsum inclusion proofs, checked before an update is installed."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
enclave-crypto = { path = "../enclave-crypto" }
ed25519-dalek = "3"
sha2 = "0.11"
thiserror = "2"
zeroize = "1"

[dev-dependencies]
sha2 = "0.11"
base64 = "0.23"
