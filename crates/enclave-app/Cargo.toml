[package]
name = "enclave-app"
description = "Private messages without a phone number (the Enclave app: desktop, Android and iOS from one Slint code base)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

# Workspace lints, except `unsafe_code` is `deny` rather than `forbid`: the
# code Slint generates for the UI needs it, and is allowed only in `mod ui`.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
dbg_macro = "deny"
todo = "deny"

[[bin]]
name = "enclave"
path = "src/main.rs"

[[bin]]
name = "enclave-shots"
path = "src/bin/shots.rs"
required-features = ["demo"]

# Linux packages (`release.yml`), from what `cargo xtask dist` gathers in
# target/<target>/release/dist: every program in /usr/lib/enclave-messenger
# (they start each other from there), `enclave` on the PATH, the desktop
# entry, AppStream metadata and icons. `enclave` is taken in Debian and
# Arch, hence the package name.
[package.metadata.deb]
name = "enclave-messenger"
maintainer = "The Enclave contributors <security@enclave.chat>"
copyright = "The Enclave contributors"
license-file = ["../../LICENSE", "0"]
extended-description = """\
A messenger that hides not only what you say but who you talk to and when: \
no phone number, post-quantum encryption, traffic through Tor and the Nym \
mixnet, and servers run by independent operators."""
section = "net"
priority = "optional"
# `$auto` finds the libraries the programs link; the window also loads
# these at run time (winit, glutin), which no tool can see.
depends = "$auto, libxkbcommon0, libxkbcommon-x11-0, libwayland-client0, libwayland-egl1, libegl1, libgl1, libx11-6, libx11-xcb1, libxcursor1, libxi6, libxrandr2"
recommends = "xdg-desktop-portal, gnome-keyring | kwalletmanager | keepassxc"
assets = [
  ["target/release/dist/enclave", "usr/lib/enclave-messenger/", "755"],
  ["target/release/dist/enclave-vault", "usr/lib/enclave-messenger/", "755"],
  ["target/release/dist/enclave-netd", "usr/lib/enclave-messenger/", "755"],
  ["target/release/dist/enclave-mediad", "usr/lib/enclave-messenger/", "755"],
  ["target/release/dist/enclave-tord", "usr/lib/enclave-messenger/", "755"],
  ["target/release/dist/enclave-nymd", "usr/lib/enclave-messenger/", "755"],
  ["target/release/dist/lyrebird", "usr/lib/enclave-messenger/", "755"],
  ["../../packaging/linux/enclave", "usr/bin/enclave", "755"],
  ["target/release/dist/share/applications/com.aricummings.Enclave.desktop", "usr/share/applications/", "644"],
  ["target/release/dist/share/metainfo/com.aricummings.Enclave.metainfo.xml", "usr/share/metainfo/", "644"],
  ["target/release/dist/share/icons/hicolor/**/*", "usr/share/icons/hicolor/", "644"],
  ["target/release/dist/THIRD-PARTY-NOTICES.txt", "usr/share/doc/enclave-messenger/", "644"],
]

[package.metadata.generate-rpm]
name = "enclave-messenger"
summary = "Private messages without a phone number"
license = "GPL-3.0-only"
url = "https://github.com/0xnullsect0r/enclave-messenger"
# As for the deb: what the window loads at run time, beyond what the
# programs link (found by `auto-req`).
requires = { libxkbcommon = "*", libxkbcommon-x11 = "*", libwayland-client = "*", libwayland-egl = "*", libglvnd-egl = "*", libglvnd-glx = "*", libX11 = "*", libX11-xcb = "*", libXcursor = "*", libXi = "*", libXrandr = "*" }
assets = [
  { source = "target/release/dist/enclave", dest = "/usr/lib/enclave-messenger/enclave", mode = "755" },
  { source = "target/release/dist/enclave-vault", dest = "/usr/lib/enclave-messenger/enclave-vault", mode = "755" },
  { source = "target/release/dist/enclave-netd", dest = "/usr/lib/enclave-messenger/enclave-netd", mode = "755" },
  { source = "target/release/dist/enclave-mediad", dest = "/usr/lib/enclave-messenger/enclave-mediad", mode = "755" },
  { source = "target/release/dist/enclave-tord", dest = "/usr/lib/enclave-messenger/enclave-tord", mode = "755" },
  { source = "target/release/dist/enclave-nymd", dest = "/usr/lib/enclave-messenger/enclave-nymd", mode = "755" },
  { source = "target/release/dist/lyrebird", dest = "/usr/lib/enclave-messenger/lyrebird", mode = "755" },
  { source = "../../packaging/linux/enclave", dest = "/usr/bin/enclave", mode = "755" },
  { source = "target/release/dist/share/applications/com.aricummings.Enclave.desktop", dest = "/usr/share/applications/com.aricummings.Enclave.desktop", mode = "644" },
  { source = "target/release/dist/share/metainfo/com.aricummings.Enclave.metainfo.xml", dest = "/usr/share/metainfo/com.aricummings.Enclave.metainfo.xml", mode = "644" },
  { source = "target/release/dist/share/icons/hicolor/16x16/apps/com.aricummings.Enclave.png", dest = "/usr/share/icons/hicolor/16x16/apps/com.aricummings.Enclave.png", mode = "644" },
  { source = "target/release/dist/share/icons/hicolor/24x24/apps/com.aricummings.Enclave.png", dest = "/usr/share/icons/hicolor/24x24/apps/com.aricummings.Enclave.png", mode = "644" },
  { source = "target/release/dist/share/icons/hicolor/32x32/apps/com.aricummings.Enclave.png", dest = "/usr/share/icons/hicolor/32x32/apps/com.aricummings.Enclave.png", mode = "644" },
  { source = "target/release/dist/share/icons/hicolor/48x48/apps/com.aricummings.Enclave.png", dest = "/usr/share/icons/hicolor/48x48/apps/com.aricummings.Enclave.png", mode = "644" },
  { source = "target/release/dist/share/icons/hicolor/64x64/apps/com.aricummings.Enclave.png", dest = "/usr/share/icons/hicolor/64x64/apps/com.aricummings.Enclave.png", mode = "644" },
  { source = "target/release/dist/share/icons/hicolor/128x128/apps/com.aricummings.Enclave.png", dest = "/usr/share/icons/hicolor/128x128/apps/com.aricummings.Enclave.png", mode = "644" },
  { source = "target/release/dist/share/icons/hicolor/256x256/apps/com.aricummings.Enclave.png", dest = "/usr/share/icons/hicolor/256x256/apps/com.aricummings.Enclave.png", mode = "644" },
  { source = "target/release/dist/share/icons/hicolor/512x512/apps/com.aricummings.Enclave.png", dest = "/usr/share/icons/hicolor/512x512/apps/com.aricummings.Enclave.png", mode = "644" },
  { source = "target/release/dist/share/icons/hicolor/scalable/apps/com.aricummings.Enclave.svg", dest = "/usr/share/icons/hicolor/scalable/apps/com.aricummings.Enclave.svg", mode = "644" },
  { source = "target/release/dist/share/icons/hicolor/symbolic/apps/com.aricummings.Enclave-symbolic.svg", dest = "/usr/share/icons/hicolor/symbolic/apps/com.aricummings.Enclave-symbolic.svg", mode = "644" },
  { source = "target/release/dist/THIRD-PARTY-NOTICES.txt", dest = "/usr/share/doc/enclave-messenger/THIRD-PARTY-NOTICES.txt", mode = "644", doc = true },
  { source = "../../LICENSE", dest = "/usr/share/licenses/enclave-messenger/LICENSE", mode = "644", doc = true },
]

[features]
# The development TCP transport (`--server ID=HOST:PORT` against
# `enclave-server dev`); never in a release build.
dev-transport = ["enclave-vault/dev-transport"]
# The demo (`enclave --demo`) and the screenshots taken from it; never in a
# release build.
demo = ["enclave-vault/demo"]

[dependencies]
enclave-platform = { path = "../enclave-platform", features = ["window"] }
enclave-ipc = { path = "../enclave-ipc" }
enclave-vault = { path = "../enclave-vault" }
enclave-crash = { path = "../enclave-crash" }
enclave-update = { path = "../enclave-update" }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
enclave-crypto = { path = "../enclave-crypto" }
slint = { version = "1.18", default-features = false, features = ["std", "compat-1-2", "renderer-software", "accessibility", "raw-window-handle-06"] }
qrcodegen = "1.8"
png = "0.17"
# The system's language, for the translations (`src/i18n.rs`).
sys-locale = "0.3"
# Reading QR codes from the camera's frames (every platform).
rqrr = "0.11"
tokio = { version = "1", features = ["rt", "sync", "time", "net", "io-util", "macros"] }

# Desktop: winit with OpenGL (femtovg, the software renderer as fallback),
# and the system's dialogs, notifications, camera and clipboard.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
slint = { version = "1.18", default-features = false, features = ["backend-winit", "renderer-femtovg", "unstable-winit-030"] }
arboard = { version = "3", default-features = false }
# The system's file dialogs (the desktop portal on Linux, so they work in a
# Flatpak too).
rfd = "0.17"
directories = "6"
# Desktop notifications (D-Bus on Linux, NSUserNotification on macOS, toasts
# on Windows).
notify-rust = "4"
# The updater's downloads (src/updater.rs), checked with enclave-update.
enclave-tls = { path = "../enclave-tls" }
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "ring", "webpki-roots"] }
http-body-util = "0.1"
bytes = "1"
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std"] }
webpki-roots = "1"
# Scanning codes with the camera: capture (AVFoundation, Media Foundation,
# V4L2; no JPEG decoder of its own, which would be C), QR reading, and
# MJPEG frames decoded in Rust.
nokhwa = { version = "0.10", default-features = false, features = ["input-native"] }
image = { version = "0.25", default-features = false, features = ["jpeg"] }

# Android: Slint's own backend on the activity (OpenGL ES through femtovg).
[target.'cfg(target_os = "android")'.dependencies]
slint = { version = "1.18", default-features = false, features = ["backend-android-activity-06", "renderer-femtovg"] }
# The phone's pickers, camera, notifications, clipboard (enclave_platform::phone).
enclave-platform = { path = "../enclave-platform", features = ["window", "phone"] }

# iOS: winit with the software renderer (no OpenGL on iOS, and no Skia
# binaries to download).
[target.'cfg(target_os = "ios")'.dependencies]
slint = { version = "1.18", default-features = false, features = ["backend-winit", "unstable-winit-030"] }
enclave-platform = { path = "../enclave-platform", features = ["window", "phone"] }

[dev-dependencies]
# The tests run the demo.
enclave-vault = { path = "../enclave-vault", features = ["demo"] }

[build-dependencies]
slint-build = "1.18"
enclave-design = { path = "../enclave-design" }

[lib]
path = "src/lib.rs"
