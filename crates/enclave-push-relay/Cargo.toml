[package]
name = "enclave-push-relay"
description = "The Enclave push relay: opens sealed push tokens, shapes wakes into 60-second windows, and delivers them to APNs, FCM and UnifiedPush. Keys rotate every 30 days from a forward-secure seed chain."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "enclave-push-relay"
path = "src/bin/enclave-push-relay.rs"

[dependencies]
enclave-crypto = { path = "../enclave-crypto" }
enclave-service = { path = "../enclave-service" }
thiserror = "2"
zeroize = "1"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "time", "sync", "signal"] }
serde_json = "1"
hyper = { version = "1", features = ["client", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
ring = "0.17"
webpki-roots = "1"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "time", "sync"] }
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "server-auto", "service"] }
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
