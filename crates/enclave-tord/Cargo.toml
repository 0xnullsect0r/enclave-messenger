[package]
name = "enclave-tord"
description = "Tor (arti) behind a loopback SOCKS5 port, for the mixnet client's gateway connection."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = ["tor"]
# Dial through Tor (the shipped build).
tor = ["dep:arti-client", "dep:tor-rtcompat", "dep:rustls", "arti-client/bridge-client", "arti-client/pt-client", "dep:obfs4", "dep:base64", "carrier-serve"]
# Dial directly instead of through Tor: tests and the local mixnet only.
# Never in a release build.
dev-direct = ["carrier-serve"]
# Carrying netd's requests to onion services and its HTTPS fetches
# (`carrier::serve`, `fetch`; RFC 0010).
carrier-serve = ["dep:rustls", "dep:tokio-rustls", "dep:webpki-roots", "dep:hyper", "dep:hyper-util", "dep:http-body-util", "dep:bytes", "dep:enclave-tls"]
# Starting enclave-tord from another process (netd, enclave-e2e).
launch = ["tokio/process"]
# enclave-onion: a server's onion service (the fallback route, N4).
onion-service = ["tor", "arti-client/onion-service-service", "dep:tor-hsservice", "dep:tor-cell", "dep:tor-proto", "dep:safelog", "dep:futures"]

[[bin]]
name = "enclave-tord"
path = "src/bin/enclave-tord.rs"

[[bin]]
name = "enclave-onion"
path = "src/bin/enclave-onion.rs"
required-features = ["onion-service"]

[dependencies]
enclave-platform = { path = "../enclave-platform" }
enclave-sandbox = { path = "../enclave-sandbox" }
async-trait = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "io-std", "macros", "time", "fs", "sync"] }
arti-client = { version = "0.46.0", default-features = false, features = ["tokio", "rustls", "onion-service-client", "compression", "static-sqlite"], optional = true }
tor-rtcompat = { version = "0.47.0", default-features = false, features = ["tokio", "rustls"], optional = true }
tor-hsservice = { version = "0.46.0", optional = true }
tor-cell = { version = "0.46.0", optional = true }
tor-proto = { version = "0.46.0", optional = true }
safelog = { version = "0.10.0", optional = true }
futures = { version = "0.3", optional = true }
# arti's TLS takes the process-wide provider, installed at start.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"], optional = true }
# obfs4 bridges in this process (censorship mode).
obfs4 = { version = "=0.1.0-alpha.1", optional = true }
base64 = { version = "0.23", optional = true }
# HTTPS through Tor for the carrier's fetches.
enclave-tls = { path = "../enclave-tls", optional = true }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"], optional = true }
webpki-roots = { version = "1", optional = true }
hyper = { version = "1", features = ["client", "http1"], optional = true }
hyper-util = { version = "0.1", features = ["tokio"], optional = true }
http-body-util = { version = "0.1", optional = true }
bytes = { version = "1", optional = true }

[target.'cfg(unix)'.dependencies]
# The state directory's lock (`daemon::claim`): flock itself, since std's
# File::try_lock isn't implemented on Android.
rustix = { version = "1", features = ["fs"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "time"] }
