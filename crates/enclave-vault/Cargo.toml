[package]
name = "enclave-vault"
description = "The Enclave vault: the client engine that holds every key, run as its own process (or a thread where processes are unavailable)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "enclave-vault"
path = "src/bin/enclave-vault.rs"

[features]
# The development TCP transport (`--server ID=HOST:PORT`); never in a
# release build.
dev-transport = ["enclave-net/dev-transport"]
# The demo (`--demo`: a local server and a demo contact, all in memory),
# for development and screenshots; never in a release build, which then
# links no server code.
demo = ["dep:enclave-sim", "dep:enclave-server"]

[dependencies]
subtle = "2"
enclave-platform = { path = "../enclave-platform", features = ["keystores"] }
enclave-core = { path = "../enclave-core" }
enclave-crypto = { path = "../enclave-crypto" }
enclave-ipc = { path = "../enclave-ipc" }
enclave-net = { path = "../enclave-net" }
enclave-store = { path = "../enclave-store" }
enclave-sandbox = { path = "../enclave-sandbox" }
enclave-media = { path = "../enclave-media" }
zeroize = "1"
enclave-rpc = { path = "../enclave-rpc" }
enclave-federation = { path = "../enclave-federation" }
async-trait = "0.1"
enclave-sim = { path = "../enclave-sim", optional = true }
enclave-server = { path = "../enclave-server", optional = true }
directories = "6"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "process"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[dev-dependencies]
# The tests run the demo.
enclave-vault = { path = ".", features = ["demo"] }
enclave-sim = { path = "../enclave-sim" }
enclave-server = { path = "../enclave-server" }
# The tests reach servers over the development transport.
enclave-net = { path = "../enclave-net", features = ["dev-transport"] }
jpeg-encoder = "0.7"
gif = "0.14"
