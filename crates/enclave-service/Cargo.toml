[package]
name = "enclave-service"
description = "Shared plumbing for Enclave's service binaries (server, relays): secret key files, forward-secure seed chains, and configuration files with environment overrides."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
thiserror = "2"
toml = "1.1"
serde = "1"
zeroize = "1"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
