[package]
name = "enclave-kt"
description = "Enclave key transparency: akd with an Enclave SHA3 configuration, signed tree heads, witness cosigning and client verification."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
unicode-normalization = "0.1"
unicode-security = "0.1"
enclave-crypto = { path = "../enclave-crypto" }
enclave-federation = { path = "../enclave-federation" }
akd = { version = "0.13.0", default-features = false, features = ["public_auditing", "parallel_vrf"] }
# The non-membership check akd uses inside lookup verification, exposed
# under `public_tests` (it pulls in nothing new): absence proofs.
akd_core = { version = "0.13.0", default-features = false, features = ["public_tests"] }
curve25519-dalek = "5"
sha2 = "0.11"
# C2SP cosignature/v1 notes (`c2sp.rs`): Ed25519 and standard base64.
ed25519-dalek = "3"
base64 = "0.23"
async-trait = "0.1"
thiserror = "2"
protobuf = "3"
tokio = { version = "1", features = ["rt-multi-thread"] }
redb = "4.3.0"

[dev-dependencies]
# akd's storage-layer test suite, run against `KtStore`.
akd = { version = "0.13.0", default-features = false, features = ["public_auditing", "parallel_vrf", "public_tests"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
