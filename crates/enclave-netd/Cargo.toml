[package]
name = "enclave-netd"
description = "The Enclave network process: carries sealed requests between the vault and servers, and holds no keys."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "enclave-netd"
path = "src/main.rs"

[features]
# The development TCP transport (`--server ID=HOST:PORT`); never in a
# release build.
dev-transport = ["enclave-net/dev-transport"]

[dependencies]
enclave-platform = { path = "../enclave-platform" }
enclave-ipc = { path = "../enclave-ipc" }
enclave-net = { path = "../enclave-net", features = ["nym"] }
enclave-nym = { path = "../enclave-nym" }
enclave-sandbox = { path = "../enclave-sandbox" }
enclave-rpc = { path = "../enclave-rpc" }
enclave-crypto = { path = "../enclave-crypto" }
enclave-tord = { path = "../enclave-tord", default-features = false, features = ["launch"] }
async-trait = "0.1"
tokio = { version = "1", features = ["rt", "macros", "sync", "io-util", "io-std", "process", "time", "fs"] }

[dev-dependencies]
# The tests reach servers over the development transport.
enclave-net = { path = "../enclave-net", features = ["dev-transport"] }
enclave-ingress = { path = "../enclave-ingress" }
enclave-wire = { path = "../enclave-wire" }
enclave-crypto = { path = "../enclave-crypto" }
enclave-federation = { path = "../enclave-federation" }
enclave-rpc = { path = "../enclave-rpc" }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "net", "io-util", "io-std", "process", "time"] }
