[package]
name = "enclave-proto"
description = "Enclave protocols: account manifest, prekey bundles, EQXDH, the Lockstep ratchet, multi-device envelopes and groups."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
enclave-crypto = { path = "../enclave-crypto" }
enclave-wire = { path = "../enclave-wire" }
bip39 = { version = "3.0.0", default-features = false, features = ["std", "all-languages"] }
zeroize = { version = "1.9.0", features = ["derive"] }
subtle = "2.6.1"
thiserror = "2"

[dev-dependencies]
hex = "0.4"
