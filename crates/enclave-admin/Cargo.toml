[package]
name = "enclave-admin"
description = "Tools for Enclave's foundation and operators: the foundation key, building and signing the server list from operators' signed descriptors, checking descriptors, and the key-transparency pins clients ship with."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "enclave-admin"
path = "src/main.rs"

[dependencies]
enclave-crypto = { path = "../enclave-crypto" }
enclave-federation = { path = "../enclave-federation" }
enclave-kt = { path = "../enclave-kt" }
enclave-service = { path = "../enclave-service" }
enclave-tls = { path = "../enclave-tls" }
enclave-update = { path = "../enclave-update" }
sha2 = "0.10"
bytes = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "ring", "webpki-roots"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt", "time", "net"] }
toml = "0.8"
webpki-roots = "1"

[dev-dependencies]
enclave-front = { path = "../enclave-front" }
enclave-server = { path = "../enclave-server" }
enclave-rpc = { path = "../enclave-rpc" }
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
