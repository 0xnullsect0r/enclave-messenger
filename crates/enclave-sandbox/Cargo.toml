[package]
name = "enclave-sandbox"
description = "Process hardening for Enclave's helper processes: no core dumps, not dumpable, no_new_privs, and a Landlock sandbox."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["process", "thread"] }

[target.'cfg(target_os = "macos")'.dependencies]
enclave-platform = { path = "../enclave-platform" }

[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4"
seccompiler = "0.5"
libc = "0.2"
