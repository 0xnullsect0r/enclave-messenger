[package]
name = "enclave-core"
description = "Enclave client engine: accounts, contacts, sessions, messaging and sync over the sealed store."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
subtle = "2.6.1"
enclave-crypto = { path = "../enclave-crypto" }
enclave-wire = { path = "../enclave-wire" }
enclave-rpc = { path = "../enclave-rpc" }
enclave-push-relay = { path = "../enclave-push-relay" }
enclave-slip39 = { path = "../enclave-slip39" }
enclave-proto = { path = "../enclave-proto" }
enclave-tokens = { path = "../enclave-tokens" }
enclave-net = { path = "../enclave-net" }
enclave-nym = { path = "../enclave-nym" }
enclave-store = { path = "../enclave-store" }
enclave-kt = { path = "../enclave-kt" }
enclave-federation = { path = "../enclave-federation" }
enclave-update = { path = "../enclave-update" }
prost = { version = "0.14", default-features = false, features = ["derive", "std"] }
thiserror = "2"
zeroize = "1"

[dev-dependencies]
enclave-sim = { path = "../enclave-sim" }
enclave-credgate = { path = "../enclave-credgate", features = ["dev-tickets"] }
async-trait = "0.1"
sha2 = "0.11"
enclave-calls = { path = "../enclave-calls" }
enclave-server = { path = "../enclave-server", features = ["test-hooks"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
