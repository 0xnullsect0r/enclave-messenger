[package]
name = "enclave-net"
description = "Enclave networking: transports (dev TCP, Tor via arti, Nym), sealed requests and the cover-traffic scheduler."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = []
# Real anonymity networks. They cannot be exercised in sandboxes without raw
# TCP; see docs/09-transport.md and docs/spikes/m4-network.md.
tor = ["dep:arti-client", "dep:tor-rtcompat"]
# The Nym transport (`NymTransport`); the mixframe and pacing types are always
# here.
nym = []
# The development TCP transport (`--server ID=HOST:PORT`, `TcpTransport`).
# Off in every release build (completion plan X17): without it HOST:PORT
# routes don't parse and the transport refuses to dial. Its marker string
# is what CI's release check looks for.
dev-transport = []

[dependencies]
enclave-crypto = { path = "../enclave-crypto" }
enclave-wire = { path = "../enclave-wire" }
enclave-rpc = { path = "../enclave-rpc" }
enclave-federation = { path = "../enclave-federation" }
async-trait = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "sync", "time"] }
thiserror = "2"
enclave-nym = { path = "../enclave-nym" }
arti-client = { version = "0.46.0", default-features = false, features = ["tokio", "rustls", "onion-service-client", "compression", "static-sqlite"], optional = true }
tor-rtcompat = { version = "0.47.0", default-features = false, features = ["tokio", "rustls"], optional = true }

[dev-dependencies]
enclave-server = { path = "../enclave-server" }
enclave-federation = { path = "../enclave-federation" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "test-util"] }

[[test]]
name = "tcp"
required-features = ["dev-transport"]
