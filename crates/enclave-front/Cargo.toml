[package]
name = "enclave-front"
description = "Enclave's HTTPS front: serves the server descriptor at /.well-known/enclave and the witness API over the Enclave TLS profile, with certificates from ACME. The key-holding server has no HTTP surface; this does, and holds no keys but its TLS key."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "enclave-front"
path = "src/bin/enclave-front.rs"

[dependencies]
enclave-service = { path = "../enclave-service" }
enclave-tls = { path = "../enclave-tls" }
enclave-witness = { path = "../enclave-witness" }
enclave-update = { path = "../enclave-update" }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
bytes = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "server", "http1"] }
hyper-util = { version = "0.1", features = ["client-legacy", "server", "service", "http1", "tokio"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "ring", "webpki-roots"] }
instant-acme = { version = "0.8", default-features = false, features = ["hyper-rustls", "ring", "rcgen"] }
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal", "fs"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
webpki-roots = "1"

[dev-dependencies]
enclave-crypto = { path = "../enclave-crypto" }
enclave-federation = { path = "../enclave-federation" }
enclave-kt = { path = "../enclave-kt" }
