[package]
name = "enclave-crypto"
description = "Enclave cryptographic core: KMAC256, EnclaveSeal, EnclaveCombine, composite signatures, SLH-DSA root, hedged RNG."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
enclave-platform = { path = "../enclave-platform" }
libcrux-ml-kem = { version = "0.0.11", default-features = false, features = ["mlkem1024"] }
libcrux-ml-dsa = { version = "0.0.11" }
slh-dsa = "0.2.0-rc.5"
ed448-goldilocks = "0.14.0-pre.15"
# X448 on formally verified p448 field arithmetic (`x448_ladder.rs`).
fiat-crypto = { version = "0.3.0", default-features = false }
classic-mceliece-rust = { version = "3.1.0", features = ["mceliece8192128", "zeroize"] }
chacha20 = { version = "0.10.2", features = ["xchacha"] }
aes = "0.9.3"
ctr = "0.10.1"
sha3 = "0.12.0"
cshake = "0.2.1"
argon2 = { version = "0.6.0", features = ["zeroize"] }
zeroize = { version = "1.9.0", features = ["derive"] }
subtle = "2.6.1"
getrandom = "0.4.3"
rand_core_06 = { package = "rand_core", version = "0.6", features = ["getrandom"] }
thiserror = "2"
# HQC-256 (FIPS 207 draft), behind `hqc` until the standard is final.
hqc-kem = { version = "=0.1.0-rc.0", default-features = false, features = ["kgen", "ecap", "dcap"], optional = true }

[features]
# HQC-256 and the four-KEM EnclaveCombine suite (External Gate G12).
hqc = ["dep:hqc-kem"]

[dev-dependencies]
# Secret poisoning under Valgrind (`tests/ctgrind.rs`).
enclave-platform = { path = "../enclave-platform", features = ["ctgrind"] }
# Oracle for `x448_ladder.rs`.
x448 = "0.14.0-pre.12"
hex = "0.4"
hex-literal = "1.1.0"
proptest = "1.11.0"
ml-kem = "0.3.2"
ml-dsa = "0.1.1"
fips205 = "0.5.0"
libcrux-kmac = "0.0.2"
ed448-goldilocks = "0.14.0-pre.15"
libcrux-ml-dsa = "0.0.11"

# Test oracle for X448 and Ed448 (`tests/differential.rs`); needs a system
# OpenSSL, which Windows runners don't have.
[target.'cfg(not(windows))'.dev-dependencies]
openssl = "0.10.81"
