[package]
name = "enclave-tls"
description = "Enclave's TLS profile: TLS 1.3 only, AES-256-GCM-SHA384 only, and the hybrid SecP384r1MLKEM1024 key exchange (P-384 + ML-KEM-1024), for the front, witnesses and update endpoints."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
enclave-crypto = { path = "../enclave-crypto" }
p384 = { version = "0.13.1", default-features = false, features = ["ecdh", "std"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "logging"] }
zeroize = "1"

[dev-dependencies]
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
