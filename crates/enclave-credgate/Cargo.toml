[package]
name = "enclave-credgate"
description = "The credential gate: Equi-X proof of work for Privacy Pass tokens, tokens for Nym ticketbooks."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# A ticket source that answers without a Nym credential proxy: tests and
# the local mixnet only. Never in a release build.
dev-tickets = []

[[bin]]
name = "enclave-credgate"
path = "src/bin/enclave-credgate.rs"

[dependencies]
enclave-crypto = { path = "../enclave-crypto" }
enclave-service = { path = "../enclave-service" }
enclave-tokens = { path = "../enclave-tokens" }
async-trait = "0.1"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
bytes = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
redb = "4.3.0"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal"] }
zeroize = "1"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time"] }
