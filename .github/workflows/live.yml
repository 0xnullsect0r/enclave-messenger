name: Live networks
# Checks against the real Tor network (nightly, and on every change to the
# Tor side) and, with the optional mixnet funded, the Nym sandbox (nightly)
# and mainnet (weekly, Mondays). They depend on networks outside this
# repository, so they never block a merge (`docs/09-transport.md` §1,
# RFC 0010).
#
# `onion-live` is the route devices take: a dev server behind
# enclave-onion's onion service on this runner, reached through
# enclave-tord as netd's carrier over the live Tor network
# (ci/onion/carrier-bench.py: bootstrap, first answer, round trips), and a
# wake sent through `enclave-onion forward` to a second onion service, as
# push egress reaches a push relay. Its numbers go in
# docs/09-transport.md §6.3.
#
# The Nym jobs run `live_bench` (nym/enclave-nym-sdk/examples) through real
# Tor: an ingress-role client and a device client, both buying zk-nym
# tickets from the Nyx account whose mnemonic is the NYM_SANDBOX_MNEMONIC or
# NYM_MAINNET_MNEMONIC secret (only with the optional mixnet, RFC 0010:
# without one the job says so and stops). The report has connect times,
# round trips, bulk throughput, memory, tickets spent, and the ticketbook
# deposit; the job turns the deposit into dollars per user per month
# (math/cover-traffic.md §11: five books a month) and fails above $1.

on:
  schedule:
    - cron: '23 3 * * *'
  # Changes to the Tor side are tried against the real network at once
  # (still never blocking).
  push:
    branches: ['**']
    paths:
      - crates/enclave-tord/**
      - ci/tor/**
      - ci/onion/**
      - .github/workflows/live.yml
  workflow_dispatch:
    inputs:
      network:
        description: Nym network for the bench
        type: choice
        options: [sandbox, mainnet]
        default: sandbox

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  tor-smoke:
    name: enclave-tord bootstraps Tor and connects through it
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@f13886b937689c021905a6b90929199931d60db1 # v2.8.1
      - name: Build enclave-tord (Tor build, as shipped)
        run: cargo build --release --locked -p enclave-tord
      - name: Bootstrap Tor and fetch a page through the SOCKS5 port
        run: |
          set -euo pipefail
          secret=$(head -c 32 /dev/urandom | od -An -tx1 | tr -d ' \n')
          state=$(mktemp -d)
          mkfifo "$state.in"
          (echo "$secret"; sleep 900) > "$state.in" &
          target/release/enclave-tord --state "$state" --report < "$state.in" > "$state.out" &
          for _ in $(seq 300); do grep -q ready "$state.out" && break; sleep 1; done
          port=$(awk '/ready/{print $2}' "$state.out")
          test -n "$port"
          # The Tor Project's check page says whether the request came
          # through Tor.
          curl -sS --max-time 120 --socks5-hostname "enclave:$secret@127.0.0.1:$port" \
            https://check.torproject.org/api/ip | tee "$state.json"
          grep -q '"IsTor":true' "$state.json"
          # Without the secret, nothing.
          ! curl -sS --max-time 30 --socks5-hostname "127.0.0.1:$port" https://check.torproject.org/api/ip
      # The fallback without lyrebird (the obfs4 crate, an alpha): live
      # bridges have reset it mid-frame, which is why lyrebird goes first.
      # Reported, not blocking the shipped path's steps below.
      - name: Through Tor's built-in obfs4 bridges (obfs4 inside enclave-tord, no lyrebird)
        continue-on-error: true
        run: |
          set -euo pipefail
          secret=$(head -c 32 /dev/urandom | od -An -tx1 | tr -d ' \n')
          state=$(mktemp -d)
          mkfifo "$state.in"
          (echo "$secret"; sleep 900) > "$state.in" &
          target/release/enclave-tord --state "$state" --builtin-bridges --report < "$state.in" > "$state.out" &
          for _ in $(seq 300); do grep -q 'ready\|blocked' "$state.out" && break; sleep 1; done
          cat "$state.out"
          port=$(awk '/ready/{print $2}' "$state.out")
          test -n "$port"
          # Bridges come and go: a circuit through one may fail while Tor
          # builds another, so the request is tried a few times.
          for i in 1 2 3 4 5; do
            curl -sS --max-time 120 --socks5-hostname "enclave:$secret@127.0.0.1:$port" \
              https://check.torproject.org/api/ip > "$state.json" && break
            echo "attempt $i failed"; sleep 20
          done
          cat "$state.json"
          grep -q '"IsTor":true' "$state.json"
      - name: Build lyrebird (Snowflake and WebTunnel)
        run: ci/tor/lyrebird.sh build target/release/lyrebird
      - name: Through Tor's built-in obfs4 bridges (lyrebird, as shipped)
        run: |
          set -euo pipefail
          secret=$(head -c 32 /dev/urandom | od -An -tx1 | tr -d ' \n')
          state=$(mktemp -d)
          mkfifo "$state.in"
          (echo "$secret"; sleep 900) > "$state.in" &
          target/release/enclave-tord --state "$state" --builtin-bridges --report < "$state.in" > "$state.out" 2> "$state.err" &
          for _ in $(seq 300); do grep -q 'ready\|blocked' "$state.out" && break; sleep 1; done
          cat "$state.out"
          # lyrebird ran obfs4, not the in-process fallback.
          if grep 'obfs4 runs in this process' "$state.err"; then exit 1; fi
          port=$(awk '/ready/{print $2}' "$state.out")
          test -n "$port"
          for i in 1 2 3 4 5; do
            curl -sS --max-time 120 --socks5-hostname "enclave:$secret@127.0.0.1:$port" \
              https://check.torproject.org/api/ip > "$state.json" && break
            echo "attempt $i failed"; sleep 20
          done
          cat "$state.json"
          grep -q '"IsTor":true' "$state.json"
      - name: Through Tor's built-in Snowflake bridges (lyrebird, started by enclave-tord)
        run: |
          set -euo pipefail
          secret=$(head -c 32 /dev/urandom | od -An -tx1 | tr -d ' \n')
          state=$(mktemp -d)
          mkfifo "$state.in"
          (echo "$secret"; sleep 900) > "$state.in" &
          target/release/enclave-tord --state "$state" --snowflake --report < "$state.in" > "$state.out" &
          for _ in $(seq 300); do grep -q 'ready\|blocked' "$state.out" && break; sleep 1; done
          cat "$state.out"
          port=$(awk '/ready/{print $2}' "$state.out")
          test -n "$port"
          # Bridges come and go: a circuit through one may fail while Tor
          # builds another, so the request is tried a few times.
          for i in 1 2 3 4 5; do
            curl -sS --max-time 120 --socks5-hostname "enclave:$secret@127.0.0.1:$port" \
              https://check.torproject.org/api/ip > "$state.json" && break
            echo "attempt $i failed"; sleep 20
          done
          cat "$state.json"
          grep -q '"IsTor":true' "$state.json"
      - name: The built-in bridges are still the Tor Project's
        continue-on-error: true
        run: ci/tor/builtin-bridges.sh --check

  onion-live:
    name: a server's onion service reached through enclave-tord's carrier over Tor
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@f13886b937689c021905a6b90929199931d60db1 # v2.8.1
      - name: Build enclave-server, enclave-onion and enclave-tord (Tor, as shipped)
        run: |
          cargo build --release --locked -p enclave-server
          cargo build --release --locked -p enclave-tord --features onion-service --bins
      - name: A dev server behind an onion service, through the carrier
        run: |
          set -euo pipefail
          work=$(mktemp -d)
          echo "WORK=$work" >> "$GITHUB_ENV"
          target/release/enclave-server dev 127.0.0.1:17443 > "$work/server.out" 2>&1 &
          target/release/enclave-onion run --state "$work/onion" --forward 127.0.0.1:17443 \
            --public "$work/public" > "$work/onion.log" 2>&1 &
          for _ in $(seq 900); do [ -s "$work/public/onion.addr" ] && break; sleep 1; done
          cat "$work/onion.log"
          host=$(tr -d '\n' < "$work/public/onion.addr")
          test -n "$host"
          python3 ci/onion/carrier-bench.py target/release/enclave-tord "$work/tor" "$host" \
            --rounds 30 --out onion-bench.json
          { echo '### The onion route over live Tor'; echo '```json'; cat onion-bench.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: A wake through enclave-onion forward to a push relay's onion service
        run: |
          set -euo pipefail
          work=$WORK
          # The relay stand-in: prints the first wake it gets.
          python3 - > "$work/relay.out" 2>&1 <<'EOF' &
          import socket, struct
          s = socket.socket(); s.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
          s.bind(("127.0.0.1", 17445)); s.listen(4)
          c, _ = s.accept()
          def read(n):
              b = b""
              while len(b) < n:
                  x = c.recv(n - len(b)); assert x; b += x
              return b
          n = struct.unpack("!I", read(4))[0]
          print(read(n).decode(), flush=True)
          EOF
          target/release/enclave-onion run --state "$work/push-onion" --forward 127.0.0.1:17445 \
            --public "$work/public" --addr-file push-onion.addr > "$work/push-onion.log" 2>&1 &
          for _ in $(seq 900); do [ -s "$work/public/push-onion.addr" ] && break; sleep 1; done
          cat "$work/push-onion.log"
          relay=$(tr -d '\n' < "$work/public/push-onion.addr")
          test -n "$relay"
          target/release/enclave-onion forward --listen 127.0.0.1:17446 --to "$relay" \
            --state "$work/egress" > "$work/egress.log" 2>&1 &
          for _ in $(seq 300); do grep -q 'wakes from' "$work/egress.log" && break; sleep 1; done
          # The server's side: one `u32 len ‖ wake` frame; resent until the
          # relay's new service is reachable.
          for i in $(seq 30); do
            python3 -c 'import socket,struct; s=socket.create_connection(("127.0.0.1",17446)); w=b"wake-through-tor"; s.sendall(struct.pack("!I",len(w))+w); s.close()'
            sleep 20
            grep -q wake-through-tor "$work/relay.out" && break
          done
          cat "$work/egress.log" "$work/relay.out"
          grep -q wake-through-tor "$work/relay.out"
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: onion-bench
          path: onion-bench.json
          if-no-files-found: ignore

  nym-bench:
    name: live_bench on the Nym ${{ matrix.network }}, through Tor
    strategy:
      fail-fast: false
      matrix:
        network: [sandbox, mainnet]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      MNEMONIC: ${{ matrix.network == 'mainnet' && secrets.NYM_MAINNET_MNEMONIC || secrets.NYM_SANDBOX_MNEMONIC }}
    steps:
      - name: Which runs today
        id: when
        run: |
          # Mainnet weekly (Mondays) on the schedule; a dispatch runs the
          # network it names.
          run=yes
          if [ "${{ github.event_name }}" = workflow_dispatch ]; then
            [ "${{ inputs.network }}" = "${{ matrix.network }}" ] || run=no
          elif [ "${{ matrix.network }}" = mainnet ] && [ "$(date -u +%u)" != 1 ]; then
            run=no
          fi
          if [ "$run" = yes ] && [ -z "$MNEMONIC" ]; then
            echo "::notice::No funded Nyx account for the ${{ matrix.network }} (the mixnet is optional, RFC 0010): skipping the bench."
            run=no
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
      - if: steps.when.outputs.run == 'yes'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: steps.when.outputs.run == 'yes'
        uses: Swatinem/rust-cache@f13886b937689c021905a6b90929199931d60db1 # v2.8.1
        with:
          workspaces: |
            .
            nym
      - if: steps.when.outputs.run == 'yes'
        name: Build enclave-tord (Tor) and live_bench
        run: |
          cargo build --release --locked -p enclave-tord
          (cd nym && cargo build --release --locked -p enclave-nym-sdk --example live_bench)
      - if: steps.when.outputs.run == 'yes'
        name: Bench through Tor
        env:
          ENCLAVE_NYM_MNEMONIC: ${{ env.MNEMONIC }}
          RUST_LOG: warn
        run: |
          set -euo pipefail
          args=()
          if [ "${{ matrix.network }}" = sandbox ]; then
            # nym-sdk reads the sandbox's details from NYM_* variables.
            curl -fsSL https://raw.githubusercontent.com/nymtech/nym/develop/envs/sandbox.env -o sandbox.env
            set -a; . ./sandbox.env; set +a
          else
            args+=(--mainnet)
          fi
          secret=$(head -c 32 /dev/urandom | od -An -tx1 | tr -d ' \n')
          state=$(mktemp -d)
          mkfifo "$state.in"
          (echo "$secret"; sleep 3000) > "$state.in" &
          target/release/enclave-tord --state "$state" < "$state.in" > "$state.out" &
          for _ in $(seq 300); do grep -q ready "$state.out" && break; sleep 1; done
          port=$(awk '/ready/{print $2}' "$state.out")
          test -n "$port"
          ENCLAVE_TOR_SOCKS=127.0.0.1:$port ENCLAVE_TOR_SECRET=$secret \
            nym/target/release/examples/live_bench "${args[@]}" --out bench.json
      - if: steps.when.outputs.run == 'yes'
        name: Cost per user per month (five books, at today's NYM price)
        run: |
          set -euo pipefail
          deposit=$(jq -r '.tickets.book_deposit // empty' bench.json)
          denom=$(jq -r '.tickets.book_deposit_denom // empty' bench.json)
          price=$(curl -fsS 'https://api.coingecko.com/api/v3/simple/price?ids=nym&vs_currencies=usd' | jq -r '.nym.usd')
          echo "deposit $deposit $denom, NYM at \$$price"
          # unym → NYM is 10^6.
          cost=$(python3 -c "print(5 * $deposit / 1e6 * $price)")
          { echo "### live_bench, ${{ matrix.network }}"; echo '```json'; cat bench.json; echo '```';
            echo "Five books a month: \$$cost per user (target ≤ \$1, math/cover-traffic.md §11)."; } >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ matrix.network }}" = mainnet ]; then
            python3 -c "import sys; sys.exit(0 if $cost <= 1.0 else 1)"
          fi
      - if: always() && steps.when.outputs.run == 'yes'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: live-bench-${{ matrix.network }}
          path: bench.json
          if-no-files-found: ignore
