name: iOS store check
# Before a release is tagged: a device build of this commit, uploaded to
# App Store Connect as a TestFlight build numbered below the release's
# (the release's own upload still goes through after it), and Apple's
# verdict on it (ci/ios/verdict.py: VALID, or INVALID with the reasons in
# the account's email). 0.1.3 and 0.1.4 were refused only after their
# tags (ITMS-90111); a change to how the app is built is checked here
# first. Made exactly as release.yml `ios` makes it: the same Xcode
# (ci/ios/xcode.sh), signing (ci/ios/signing.sh) and bundle.

on:
  push:
    branches-ignore: [main]
    paths:
      - apps/ios/**
      - ci/ios/**
      - .github/workflows/ios-store-check.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-store-check
  cancel-in-progress: false

jobs:
  verdict:
    name: Apple's verdict on a device build
    runs-on: xcode-27
    timeout-minutes: 180
    environment: release-apple
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          cache: false
      - run: rustup target add aarch64-apple-ios wasm32-wasip1
      - name: The newest released Xcode
        run: ci/ios/xcode.sh
      - name: Distribution certificate, provisioning profile, App Store Connect key
        env:
          P12: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          NSE_PROFILE: ${{ secrets.IOS_NSE_PROVISIONING_PROFILE_BASE64 }}
          BROADCAST_PROFILE: ${{ secrets.IOS_BROADCAST_PROVISIONING_PROFILE_BASE64 }}
          ASC_P8: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          [ -n "$P12" ] && [ -n "$PROFILE" ] && [ -n "$ASC_P8" ] || {
            echo "the release-apple environment's secrets aren't available to this branch (its deployment branches may allow tags only)"
            exit 1
          }
          ci/ios/signing.sh
      - name: The app for devices, numbered below the release's
        env:
          IOS_EXPORT_COMPLIANCE_CODE: ${{ vars.IOS_EXPORT_COMPLIANCE_CODE }}
        run: |
          set -euo pipefail
          v=$(cargo xtask version)
          code=$(cargo xtask version --android-code "$v")
          # 10598.12.1 for 0.1.5 (10599): one to three integers, below.
          build="$((code - 1)).$GITHUB_RUN_NUMBER.$GITHUB_RUN_ATTEMPT"
          echo "VERSION=$v" >> "$GITHUB_ENV"
          echo "BUILD=$build" >> "$GITHUB_ENV"
          ENCLAVE_VERSION=$v IOS_BUILD_NUMBER=$build apps/ios/bundle.sh out
          rm -rf out/x && mkdir out/x && (cd out/x && unzip -q ../*.ipa)
          # What App Store processing reads, for the record.
          for p in out/x/Payload/Enclave.app/Info.plist out/x/Payload/Enclave.app/PlugIns/*/Info.plist; do
            echo "== $p"
            for k in CFBundleShortVersionString CFBundleVersion DTXcode DTXcodeBuild DTSDKName DTSDKBuild DTPlatformName DTPlatformVersion DTPlatformBuild DTCompiler BuildMachineOSBuild; do
              printf '%s = %s\n' "$k" "$(/usr/libexec/PlistBuddy -c "Print :$k" "$p" 2>/dev/null || echo MISSING)"
            done
          done
      - name: Upload, and Apple's verdict
        env:
          ASC_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_API_KEY_ISSUER_ID }}
        run: python3 ci/ios/verdict.py out/Enclave-"$VERSION"-ios.ipa "$VERSION" "$BUILD"
      - if: always()
        run: rm -f "$RUNNER_TEMP/asc.p8" "$RUNNER_TEMP/"*.mobileprovision; security delete-keychain "$RUNNER_TEMP/ios.keychain-db" 2>/dev/null || true
