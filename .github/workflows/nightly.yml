name: Nightly
# Long checks that don't run on every push.
#
# repro-nix: the Nix build (nix/default.nix) of the desktop programs, the
# server's and the Nym ingress, on two machines (different runner images);
# their outputs must be byte-identical (docs/19-ops.md §2).
#
# flathub: the Flathub submission (packaging/flatpak/flathub.sh, External
# Gate G4) built from source with no network, as Flathub builds it, and
# started.

on:
  schedule:
    - cron: '41 2 * * *'
  workflow_dispatch:
  push:
    # Branches only: path filters don't apply to tag pushes, and a release
    # tag has its own workflow.
    branches: ['**']
    paths:
      - packaging/flatpak/**
      - nix/**
      - flake.nix
      - .github/workflows/nightly.yml

permissions:
  contents: read

jobs:
  flathub:
    name: Flathub build from source (offline)
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Tools, runtime and SDK extensions
        run: |
          set -euo pipefail
          sudo apt-get update && sudo apt-get install -y flatpak flatpak-builder python3-venv python3-yaml
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub org.freedesktop.Platform//25.08 org.freedesktop.Sdk//25.08 \
            org.freedesktop.Sdk.Extension.rust-stable//25.08 org.freedesktop.Sdk.Extension.golang//25.08 \
            org.freedesktop.Sdk.Extension.llvm20//25.08
      - name: The manifest and its sources, for this commit
        run: |
          git tag -f nightly-flathub HEAD
          packaging/flatpak/flathub.sh nightly-flathub flathub
          # The local clone stands in for GitHub (the tag exists only here).
          sed -i "s|url: https://github.com/0xnullsect0r/enclave-messenger.git|url: file://$PWD|" flathub/com.aricummings.Enclave.yml
      - name: Build without network, install, start
        run: |
          set -euo pipefail
          flatpak-builder --user --force-clean --sandbox --install build flathub/com.aricummings.Enclave.yml
          flatpak run com.aricummings.Enclave --version | grep '^enclave '
          for p in enclave-vault enclave-netd enclave-mediad enclave-tord enclave-nymd lyrebird; do
            flatpak run --command=test com.aricummings.Enclave -x "/app/lib/enclave-messenger/$p"
          done
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flathub-manifest
          path: flathub/

  fuzz:
    # Coverage-guided fuzzing of every parser (fuzz/, docs/20-assurance.md):
    # ten minutes a target each night; a crash fails the job and its input
    # is kept as an artifact (`enclave_fuzz::run(name, bytes)` replays it).
    name: Fuzz (${{ matrix.target }})
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        target: [wire, proto, rpc, content, calls, server, relay, group_open, ipc, media, net]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Nightly toolchain and cargo-fuzz
        run: |
          rustup toolchain install nightly --profile minimal
          cargo +nightly install cargo-fuzz --locked --version 0.13.2
      - name: Fuzz
        working-directory: fuzz
        run: cargo +nightly fuzz run ${{ matrix.target }} -- -max_total_time=600 -rss_limit_mb=4096
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: fuzz/artifacts/

  nix-build:
    name: Nix build (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-22.04]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Nix (pinned installer)
        run: |
          set -euo pipefail
          curl -sSfL -o "$RUNNER_TEMP/install" https://releases.nixos.org/nix/nix-2.31.2/install
          echo "078e2ffeddf6a9c1f22adf41458ccc46a58bb26911a9e01579645314f9982994  $RUNNER_TEMP/install" | sha256sum -c
          sh "$RUNNER_TEMP/install" --daemon --yes --nix-extra-conf-file /dev/stdin <<'CONF'
          experimental-features = nix-command flakes
          sandbox = true
          CONF
          echo /nix/var/nix/profiles/default/bin >> "$GITHUB_PATH"
      - name: Build
        run: |
          set -euo pipefail
          mkdir -p hashes
          for p in enclave enclave-server enclave-nym; do
            nix build -L --no-link --print-out-paths ".#$p" > "hashes/$p.path"
            nix path-info --json "$(cat "hashes/$p.path")" > "hashes/$p.json"
            nix hash path "$(cat "hashes/$p.path")" > "hashes/$p.nar"
            echo "$p: $(cat "hashes/$p.path") $(cat "hashes/$p.nar")"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nix-${{ matrix.runner }}
          path: hashes

  repro-nix:
    name: Two Nix rebuilders agree
    needs: nix-build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: nix-*
      - name: Same outputs, byte for byte
        run: |
          set -euo pipefail
          for p in enclave enclave-server enclave-nym; do
            a=$(cat "nix-ubuntu-24.04/$p.nar") b=$(cat "nix-ubuntu-22.04/$p.nar")
            echo "$p: $a / $b"
            [ "$a" = "$b" ] || { echo "::error::$p differs between the two builds"; exit 1; }
          done
