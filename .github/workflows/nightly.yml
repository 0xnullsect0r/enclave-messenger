name: Nightly
# Long checks that don't run on every push.
#
# repro-nix: the Nix build (nix/default.nix) of the desktop programs, the
# server's and the Nym ingress, on two machines (different runner images);
# their outputs must be byte-identical (docs/19-ops.md §2).
#
# transcribe: voice-note transcription with the real speech model.
#
# dudect: the constant-time timing tests (RT-15), on a quiet runner.
#
# shape: the traffic-shape scenarios (`cargo xtask shape`, RT-01, RT-12).
#
# call-quality: call audio under packet loss, scored with PESQ.
#
# flathub: the Flathub submission (packaging/flatpak/flathub.sh, External
# Gate G4) built from source with no network, as Flathub builds it, and
# started.

on:
  schedule:
    - cron: '41 2 * * *'
  workflow_dispatch:
  push:
    # Branches only: path filters don't apply to tag pushes, and a release
    # tag has its own workflow.
    branches: ['**']
    paths:
      - packaging/flatpak/**
      - nix/**
      - flake.nix
      - .github/workflows/nightly.yml

permissions:
  contents: read

jobs:
  flathub:
    name: Flathub build from source (offline)
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Tools, runtime and SDK extensions
        run: |
          set -euo pipefail
          sudo apt-get update && sudo apt-get install -y flatpak flatpak-builder python3-venv python3-yaml
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub org.freedesktop.Platform//25.08 org.freedesktop.Sdk//25.08 \
            org.freedesktop.Sdk.Extension.rust-stable//25.08 org.freedesktop.Sdk.Extension.golang//25.08 \
            org.freedesktop.Sdk.Extension.llvm20//25.08
      - name: The manifest and its sources, for this commit
        run: |
          git tag -f nightly-flathub HEAD
          packaging/flatpak/flathub.sh nightly-flathub flathub
          # The local clone stands in for GitHub (the tag exists only here).
          sed -i "s|url: https://github.com/0xnullsect0r/enclave-messenger.git|url: file://$PWD|" flathub/com.aricummings.Enclave.yml
      - name: Build without network, install, start
        run: |
          set -euo pipefail
          # The sources first, retried (crates.io answers an occasional 500);
          # the build itself then runs without network.
          for try in 1 2 3 4; do
            flatpak-builder --user --download-only build flathub/com.aricummings.Enclave.yml && break
            [ "$try" = 4 ] && exit 1
            sleep $((try * 30))
          done
          flatpak-builder --user --force-clean --sandbox --disable-download --install build flathub/com.aricummings.Enclave.yml
          flatpak run com.aricummings.Enclave --version | grep '^enclave '
          for p in enclave-vault enclave-netd enclave-mediad enclave-tord enclave-nymd lyrebird; do
            flatpak run --command=test com.aricummings.Enclave -x "/app/lib/enclave-messenger/$p"
          done
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flathub-manifest
          path: flathub/

  dudect:
    runs-on: ubuntu-24.04
    if: github.event_name != 'push'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo xtask dudect

  shape:
    runs-on: ubuntu-24.04
    if: github.event_name != 'push'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo xtask shape

  fuzz:
    # Coverage-guided fuzzing of every parser (fuzz/, docs/20-assurance.md):
    # ten minutes a target each night; a crash fails the job and its input
    # is kept as an artifact (`enclave_fuzz::run(name, bytes)` replays it).
    name: Fuzz (${{ matrix.target }})
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        target: [wire, proto, rpc, content, calls, server, relay, group_open, ipc, update, media, net]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Nightly toolchain and cargo-fuzz
        run: |
          rustup toolchain install nightly --profile minimal
          cargo +nightly install cargo-fuzz --locked --version 0.13.2
      - name: Fuzz
        working-directory: fuzz
        run: cargo +nightly fuzz run ${{ matrix.target }} -- -max_total_time=600 -rss_limit_mb=4096
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: fuzz/artifacts/

  transcribe:
    # Voice-note transcription with the real model (docs/18-a11y-i18n.md
    # §1.1a): the three files the app downloads, checked against the hashes
    # it pins, and a recording of speech, transcribed by enclave-media and
    # through the vault's engine.
    name: Transcription with the speech model
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The model and a recording
        run: |
          set -euo pipefail
          m="$RUNNER_TEMP/whisper"; mkdir -p "$m"
          base=$(sed -n 's/^    "\(https:\/\/huggingface.co[^"]*\)";/\1/p' crates/enclave-media/src/transcribe.rs)
          test -n "$base"
          for f in config-tiny.json tokenizer-tiny.json model-tiny-q80.gguf; do
            curl -sSfL --retry 4 -o "$m/$f" "$base$f"
          done
          ( cd "$m" && sha256sum -c ) <<'SUMS'
          ffdccec4f3211f4c63310f2b7098f309fe70f3952cedc5e4d11e43f5b2379b98  config-tiny.json
          dfc530298b6fbed1a97c6472c575b026453706e2a204c7f7038f2c9d208b0759  tokenizer-tiny.json
          edcc907db61aef092f1244dc1e53c55056b472be343e9bbb4dc12ebd4740392f  model-tiny-q80.gguf
          SUMS
          curl -sSfL --retry 4 -o "$m/jfk.wav" https://raw.githubusercontent.com/ggml-org/whisper.cpp/v1.7.6/samples/jfk.wav
          echo "59dfb9a4acb36fe2a2affc14bacbee2920ff435cb13cc314a08c13f66ba7860e  $m/jfk.wav" | sha256sum -c
          echo "ENCLAVE_WHISPER_DIR=$m" >> "$GITHUB_ENV"
          echo "ENCLAVE_WHISPER_SAMPLE=$m/jfk.wav" >> "$GITHUB_ENV"
      - name: Libraries
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config libfontconfig1-dev libxkbcommon-dev libasound2-dev libpipewire-0.3-dev
      - name: Transcribe
        env:
          ENCLAVE_WHISPER_EXPECT: "fellow americans,ask not,your country"
        run: |
          set -euo pipefail
          cargo test --locked -p enclave-media --features transcribe --lib transcribes_speech_with_the_model -- --nocapture 2>&1 | tee out.txt
          grep -q "^transcript: " out.txt
          cargo test --locked -p enclave-vault --test pictures voice_note_through_the_engine -- --nocapture 2>&1 | tee out.txt
          grep -q "transcript of the tone" out.txt

  call-quality:
    # Calls under 0, 1, 5 and 10 % packet loss, scored with PESQ on a
    # recording of speech (docs/11-calls.md §10; ci/calls/pesq.py).
    name: Call audio quality under loss (PESQ)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Libraries, PESQ and a recording
        run: |
          set -euo pipefail
          sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config libfontconfig1-dev libxkbcommon-dev libasound2-dev libpipewire-0.3-dev
          python3 -m venv "$RUNNER_TEMP/py"
          "$RUNNER_TEMP/py/bin/pip" install pesq==0.0.4 numpy==2.4.6 scipy==1.17.1
          curl -sSfL --retry 4 -o "$RUNNER_TEMP/jfk.wav" https://raw.githubusercontent.com/ggml-org/whisper.cpp/v1.7.6/samples/jfk.wav
          echo "59dfb9a4acb36fe2a2affc14bacbee2920ff435cb13cc314a08c13f66ba7860e  $RUNNER_TEMP/jfk.wav" | sha256sum -c
      - name: Calls under loss, scored
        env:
          ENCLAVE_CALL_QUALITY_DIR: ${{ runner.temp }}/calls
        run: |
          set -euo pipefail
          ENCLAVE_CALL_SPEECH="$RUNNER_TEMP/jfk.wav" cargo test --locked -p enclave-vault --test calls call_quality_under_loss -- --nocapture
          "$RUNNER_TEMP/py/bin/python" -I ci/calls/pesq.py "$ENCLAVE_CALL_QUALITY_DIR"
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: call-quality
          path: ${{ runner.temp }}/calls

  nix-build:
    name: Nix build (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-22.04]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Nix (pinned installer)
        run: |
          set -euo pipefail
          curl -sSfL -o "$RUNNER_TEMP/install" https://releases.nixos.org/nix/nix-2.31.2/install
          echo "078e2ffeddf6a9c1f22adf41458ccc46a58bb26911a9e01579645314f9982994  $RUNNER_TEMP/install" | sha256sum -c
          sh "$RUNNER_TEMP/install" --daemon --yes --nix-extra-conf-file /dev/stdin <<'CONF'
          experimental-features = nix-command flakes
          sandbox = true
          CONF
          echo /nix/var/nix/profiles/default/bin >> "$GITHUB_PATH"
      - name: Build
        run: |
          set -euo pipefail
          mkdir -p hashes
          for p in enclave enclave-server enclave-nym; do
            nix build -L --no-link --print-out-paths ".#$p" > "hashes/$p.path"
            nix path-info --json "$(cat "hashes/$p.path")" > "hashes/$p.json"
            nix hash path "$(cat "hashes/$p.path")" > "hashes/$p.nar"
            echo "$p: $(cat "hashes/$p.path") $(cat "hashes/$p.nar")"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nix-${{ matrix.runner }}
          path: hashes

  repro-nix:
    name: Two Nix rebuilders agree
    needs: nix-build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: nix-*
      - name: Same outputs, byte for byte
        run: |
          set -euo pipefail
          for p in enclave enclave-server enclave-nym; do
            a=$(cat "nix-ubuntu-24.04/$p.nar") b=$(cat "nix-ubuntu-22.04/$p.nar")
            echo "$p: $a / $b"
            [ "$a" = "$b" ] || { echo "::error::$p differs between the two builds"; exit 1; }
          done
