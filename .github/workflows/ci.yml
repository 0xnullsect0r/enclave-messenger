name: CI
# Every action is pinned to a full commit SHA (the tag is in the comment);
# Dependabot (.github/dependabot.yml) proposes updates.

on:
  push:
    # Dependabot's branches run once, as pull requests.
    branches: ['**', '!dependabot/**']
  pull_request:
  merge_group:

permissions:
  contents: read

# The toolchain is rust-toolchain.toml's (1.94.1); rustup on the runners
# installs it on first use.

# Pull requests: a new push supersedes the run in progress. Branch pushes:
# every commit gets its own complete run (a group per commit), so a burst
# of pushes doesn't leave the branch with no finished result.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt, clippy, test (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install system OpenSSL (test oracle only) and UI build dependencies
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config libfontconfig1-dev libxkbcommon-dev libasound2-dev libpipewire-0.3-dev
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --release
      - name: HQC-256 behind its feature (External Gate G12)
        run: |
          cargo clippy -p enclave-crypto -p enclave-proto --features enclave-crypto/hqc --all-targets -- -D warnings
          cargo test --release -p enclave-crypto --features hqc --lib --test hqc
      - name: mediad as WebAssembly matches native (iOS's sandbox)
        run: |
          rustup target add wasm32-wasip1
          cargo build --release --locked --target wasm32-wasip1 -p enclave-mediad --bin enclave-mediad
          ENCLAVE_MEDIAD_WASM=$PWD/target/wasm32-wasip1/release/enclave-mediad.wasm \
            cargo test --release --locked -p enclave-wasmbox
      - name: Label registry matches code
        run: cargo xtask labels
      - name: App icons match their design
        run: cargo xtask icons --check
      - name: The app's open-source notices are current
        run: cargo xtask licenses --check
      - name: Translations extracted, catalogs merged, every shown string translatable
        run: cargo xtask i18n --check
      - name: Render UI screenshots (software renderer, light and dark; and the pseudo-locales)
        run: |
          cargo run --release -p enclave-app --features demo --bin enclave-shots -- target/shots
          ENCLAVE_LANG=en-XA cargo run --release -p enclave-app --features demo --bin enclave-shots -- target/shots/en-XA
          ENCLAVE_LANG=ar-XB cargo run --release -p enclave-app --features demo --bin enclave-shots -- target/shots/ar-XB
          ENCLAVE_TEXT_SCALE=1.5 cargo run --release -p enclave-app --features demo --bin enclave-shots -- target/shots/text-150
          ENCLAVE_TEXT_SCALE=2.0 cargo run --release -p enclave-app --features demo --bin enclave-shots -- target/shots/text-200
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots
          path: target/shots

  build-macos:
    name: build and test (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --release

  build-windows:
    name: build and test (Windows)
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --release

  deny:
    name: cargo-deny
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1

  vet:
    name: cargo-vet
    runs-on: ubuntu-24.04
    # Every dependency is audited (ours or imported) or listed as an
    # exemption in supply-chain/config.toml; supply-chain/README.md says
    # which exemptions still need a human audit.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: cargo install --locked cargo-vet@0.10.2
      - run: cargo vet --locked
      - run: cargo vet --locked
        working-directory: nym
      # RT-14: crates that hold keys or parse untrusted input must be
      # audited, not exempted. Needs the human audits (External Gate G15),
      # so it reports here and must pass before 1.0 (release checklist).
      - name: Crypto and parser crates audited (report until G15)
        continue-on-error: true
        run: cargo test -p xtask -- --ignored --exact supply::tests::rt14_cargo_vet_complete_for_crypto_and_parsers

  deny-ios:
    name: cargo-deny (iOS licences)
    runs-on: ubuntu-24.04
    # No LGPL or GPL-only third-party code in the iOS build (ADR 0004).
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          arguments: --target aarch64-apple-ios --config deny-ios.toml
          command: check licenses
      # The iOS program itself is built from the nym/ workspace
      # (enclave-mobile, bin enclave-ios; PC-09).
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: nym/Cargo.toml
          arguments: --target aarch64-apple-ios --config deny-ios.toml
          command: check licenses

  repro:
    name: reproducible builds
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: UI build dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libfontconfig1-dev libxkbcommon-dev libasound2-dev libpipewire-0.3-dev
      # Two clean release builds of every client program (RT-13) and every
      # server program (RT-28) must be byte-identical.
      - run: cargo test -p xtask -- --ignored --exact repro_tests::rt13_reproducible_build_diff_empty
      - run: rm -rf target/repro-a target/repro-b
      - run: cargo test -p xtask -- --ignored --exact repro_tests::rt28_server_build_reproducible

  ctgrind:
    name: constant time under Valgrind (ctgrind)
    runs-on: ubuntu-24.04
    # RT-15: secret keys poisoned for Memcheck while ML-KEM and McEliece
    # decapsulate (crates/enclave-crypto/tests/ctgrind.rs).
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: sudo apt-get update && sudo apt-get install -y valgrind
      - run: cargo xtask ctgrind

  proverif:
    name: formal models (ProVerif)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Ubuntu has no proverif package: build the pinned release from source.
      - name: Install ProVerif 2.05
        run: |
          sudo apt-get update && sudo apt-get install -y ocaml-nox
          curl -sSfL -o pv.tgz https://bblanche.gitlabpages.inria.fr/proverif/proverif2.05.tar.gz
          echo "4871f53c32ab4a04669a060c4886ba5d9080496963fb980a9a62d2c429ceabc4  pv.tgz" | sha256sum -c
          tar xzf pv.tgz && (cd proverif2.05 && ./build -nointeract)
          echo "PROVERIF=$PWD/proverif2.05/proverif" >> "$GITHUB_ENV"
      - name: Every query gives its expected result
        run: cargo xtask proverif

  tamarin:
    name: formal models (Tamarin)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The pinned Tamarin and Maude releases, checked against their
      # SHA-256 (Ubuntu's Maude 3.2 can't unify the DH models).
      - name: Install Tamarin 1.10.0 and Maude 3.5
        run: |
          curl -sSfL -o tamarin.tgz https://github.com/tamarin-prover/tamarin-prover/releases/download/1.10.0/tamarin-prover-1.10.0-linux64-ubuntu.tar.gz
          curl -sSfL -o maude.zip https://github.com/maude-lang/Maude/releases/download/Maude3.5/Maude-3.5-linux-x86_64.zip
          echo "538fe055b65f419aac4710015948f0e6a2253d2f61958c136e2d2bd67981028c  tamarin.tgz" | sha256sum -c
          echo "e74cb8cf91b2d8b45440b54ef037180b581279358facf49f656e5b126eb7d1d3  maude.zip" | sha256sum -c
          mkdir tamarin maude && tar xzf tamarin.tgz -C tamarin && unzip -q maude.zip -d maude
          chmod +x maude/maude
          echo "$PWD/maude" >> "$GITHUB_PATH"
          echo "TAMARIN=$PWD/tamarin/tamarin-prover" >> "$GITHUB_ENV"
      - name: Every lemma gives its expected result
        run: cargo xtask tamarin

  cryptoverif:
    name: formal proofs (CryptoVerif)
    runs-on: ubuntu-24.04
    # Computational proofs of EnclaveSeal (IND-CPA if either cipher is
    # secure, INT-CTXT) and EnclaveCombine (secret if any one input is).
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install CryptoVerif 2.13
        run: |
          sudo apt-get update && sudo apt-get install -y ocaml-nox
          curl -sSfL -o cv.tgz https://bblanche.gitlabpages.inria.fr/CryptoVerif/cryptoverif2.13.tar.gz
          echo "e6edb422a065bd7d59a452110c1b200104b74d87418eb3e5113a3ff18ec538f5  cv.tgz" | sha256sum -c
          tar xzf cv.tgz && (cd cryptoverif2.13 && ./build)
          echo "CRYPTOVERIF=$PWD/cryptoverif2.13/cryptoverif" >> "$GITHUB_ENV"
      - name: Every model's queries are proved
        run: cargo xtask cryptoverif

  hax:
    name: code extraction (hax, F*)
    runs-on: ubuntu-24.04
    # Experimental, as docs/20-assurance.md §2 says: reported, not required.
    continue-on-error: true
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Nix
        run: |
          curl -sSfL https://releases.nixos.org/nix/nix-2.28.3/install | sh -s -- --no-daemon
          echo "$HOME/.nix-profile/bin" >> "$GITHUB_PATH"
          mkdir -p ~/.config/nix
          echo "experimental-features = nix-command flakes" >> ~/.config/nix/nix.conf
      - name: Extract the Ed448 signer and the X448 ladder to F*
        # hax 0.4.2 (cargo-hax-v0.4.2), pinned by commit.
        run: HAX="nix run github:cryspen/hax/5ccf89dd2e996c9f88f2267eaa2a64739c4ca41a --" formal/hax/extract.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: hax-fstar
          path: crates/enclave-crypto/proofs/fstar/extraction
          if-no-files-found: ignore

  postgres:
    name: server state on PostgreSQL
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_PASSWORD: enclave
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # The same tests on redb and on PostgreSQL (tests/common/mod.rs).
      - name: Backend conformance, restarts and replays on both backends
        env:
          ENCLAVE_TEST_POSTGRES: postgres://postgres:enclave@127.0.0.1:5432/postgres
          ENCLAVE_REQUIRE_POSTGRES: "1"
        run: cargo test -p enclave-server --test backends --test restart --test replay -- --nocapture

  scale-smoke:
    name: server scale example (2,000 accounts)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # The 100,000-account run behind 12-servers.md §7 is a release
      # checklist step; this keeps the example working.
      - run: cargo run --release -p enclave-server --example scale -- --accounts 2000 --samples 500 | tee -a "$GITHUB_STEP_SUMMARY"

  nym:
    name: nym/ workspace (nym-sdk driver, enclave-ingress, enclave-nymd)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: nym
      # The phone app (enclave-mobile) builds the app crate, which links
      # fontconfig and xkbcommon on a Linux host.
      - run: sudo apt-get update && sudo apt-get install -y pkg-config libfontconfig1-dev libxkbcommon-dev libasound2-dev libpipewire-0.3-dev
      - name: fmt, clippy, test
        working-directory: nym
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo test --workspace --locked
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: nym/Cargo.toml
          arguments: --config nym/deny.toml

  phones:
    name: Phone code (Android app crates, iOS platform code, Java)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: nym
          key: phones
      - name: NDK r28, Rust targets, cargo-ndk
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "ndk;28.2.13676358" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
          # Slint's Android backend compiles its Java against this.
          test -f "$ANDROID_HOME/platforms/android-36/android.jar"
          echo "ANDROID_JAR=$ANDROID_HOME/platforms/android-36/android.jar" >> "$GITHUB_ENV"
          rustup target add aarch64-linux-android aarch64-apple-ios
          cargo install --locked cargo-ndk@4.1.2
      # What only phones compile (enclave-platform's phone module, the
      # app's phone shell and vault glue), which the desktop jobs never see.
      - name: clippy for Android
        working-directory: nym
        run: cargo ndk --platform 28 -t arm64-v8a clippy --locked -p enclave-mobile -p enclave-app -p enclave-platform -p enclave-vault -- -D warnings
      - name: clippy for iOS (the platform code; the app builds on macOS at release)
        run: cargo clippy --locked -p enclave-platform --features phone --target aarch64-apple-ios -- -D warnings
      - name: Java sources compile (the F-Droid flavour; Play's needs Firebase)
        run: |
          javac -Xlint:all -Werror -cp "$ANDROID_HOME/platforms/android-36/android.jar" -d "$RUNNER_TEMP/java" \
            apps/android/app/src/main/java/com/aricummings/enclave/*.java \
            apps/android/app/src/fdroid/java/com/aricummings/enclave/*.java

  tls-interop:
    name: TLS interop (OpenSSL 3.5), ACME (pebble), C2SP cosignatures (Go)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # Alpine 3.22 ships OpenSSL 3.5 with SecP384r1MLKEM1024.
      - name: OpenSSL 3.5 image
        run: printf 'FROM alpine:3.22\nRUN apk add --no-cache openssl\n' | docker build -q -t enclave-openssl35 -
      - name: Pebble (test ACME CA)
        run: |
          GOBIN=$PWD/.pebble go install github.com/letsencrypt/pebble/v2/cmd/pebble@v2.8.0
          src=$(go env GOMODCACHE)/github.com/letsencrypt/pebble/v2@v2.8.0
          (cd "$src" && PEBBLE_VA_NOSLEEP=1 "$GITHUB_WORKSPACE/.pebble/pebble" -config test/config/pebble-config.json > /tmp/pebble.log 2>&1 &)
          echo "ENCLAVE_PEBBLE_CA=$src/test/certs/pebble.minica.pem" >> "$GITHUB_ENV"
          for i in $(seq 1 50); do grep -q "Listening on" /tmp/pebble.log && break; sleep 0.2; done
      - name: Interop and ACME tests
        env:
          ENCLAVE_OPENSSL: docker run --rm -i --network host -v /tmp:/tmp enclave-openssl35 openssl
          ENCLAVE_PEBBLE_DIRECTORY: https://localhost:14000/dir
          ENCLAVE_PEBBLE_ROOT_URL: https://localhost:15000/roots/0
          ENCLAVE_REQUIRE_INTEROP: "1"
        run: |
          cargo test -p enclave-tls --test openssl35 -- --nocapture
          cargo test -p enclave-front --test front -- --nocapture
      # Witness notes checked by the reference Go implementation of C2SP
      # signed notes and cosignatures (Ed25519 cosignature/v1, ML-DSA-44).
      - name: C2SP cosignatures verify with transparency-dev/formats
        env:
          ENCLAVE_C2SP_OUT: ${{ runner.temp }}/c2sp
        run: |
          cargo test -p enclave-witness --test witness -- --nocapture
          (cd ci/c2sp && go run . "$ENCLAVE_C2SP_OUT")
      - if: failure()
        run: cat /tmp/pebble.log

  federation-e2e-tcp:
    name: federation e2e (3 stacks, dev transport)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          # Docker Hub rate-limits anonymous pulls from shared runners (a
          # 429 on a base image failed this job once); its mirror at
          # mirror.gcr.io serves the same digests, Docker Hub stays the
          # fallback.
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
      - name: Server image (ops/docker/Dockerfile)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ops/docker/Dockerfile
          target: server
          tags: enclave-server:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: No shell in the image, and it runs as nonroot
        run: |
          ! docker run --rm --entrypoint /bin/sh enclave-server:ci -c true 2>/dev/null
          test "$(docker inspect --format '{{.Config.User}}' enclave-server:ci)" = "nonroot:nonroot"
      - name: Host tools
        run: cargo build --release --locked -p enclave-admin -p enclave-e2e
      - name: Three stacks, one foundation
        run: ci/federation/gen.sh up
      - name: End to end, with a restart of one stack
        run: ci/federation/gen.sh e2e
      - if: failure()
        run: ci/federation/gen.sh logs
      - if: always()
        run: ci/federation/gen.sh down

  federation-e2e-onion:
    name: federation e2e (3 stacks over the onion route, RFC 0010)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          # Docker Hub rate-limits anonymous pulls from shared runners (a
          # 429 on a base image failed this job once); its mirror at
          # mirror.gcr.io serves the same digests, Docker Hub stays the
          # fallback.
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
      - name: Server image (ops/docker/Dockerfile)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ops/docker/Dockerfile
          target: server
          tags: enclave-server:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Host tools
        run: |
          cargo build --release --locked -p enclave-admin -p enclave-e2e
          # The onion carrier netd runs on a device, dialling the stacks'
          # onion names directly here (ENCLAVE_DEV_ONION_MAP; no Tor network
          # in CI: live.yml's onion-live runs it through Tor).
          cargo build --release --locked -p enclave-tord --no-default-features --features dev-direct
      - name: Three stacks, one foundation, onion addresses in the list
        run: TRANSPORT=onion ci/federation/gen.sh up
      - name: End to end over the onion carrier, with a restart of one stack
        run: TRANSPORT=onion TORD=$PWD/target/release/enclave-tord ci/federation/gen.sh e2e
      - name: Traffic shape, from a capture of the carrier's streams
        run: |
          command -v tcpdump >/dev/null || sudo apt-get install -y --no-install-recommends tcpdump
          TRANSPORT=onion TORD=$PWD/target/release/enclave-tord ci/federation/gen.sh shape
          { echo '### Traffic shape over the onion route'; echo '```'; tail -n 12 target/federation/shape/report.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: traffic-shape-onion
          path: target/federation/shape/
          if-no-files-found: ignore
      - if: failure()
        run: TRANSPORT=onion ci/federation/gen.sh logs
      - if: always()
        run: TRANSPORT=onion ci/federation/gen.sh down

  federation-e2e-localnet:
    name: federation e2e (3 stacks over a local Nym mixnet)
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            . -> target
            nym -> target
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          # Docker Hub rate-limits anonymous pulls from shared runners (a
          # 429 on a base image failed this job once); its mirror at
          # mirror.gcr.io serves the same digests, Docker Hub stays the
          # fallback.
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
      - name: Server image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ops/docker/Dockerfile
          target: server
          tags: enclave-server:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Nym ingress image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ops/docker/Dockerfile
          target: nym
          tags: enclave-nym:ci
          # A local mixnet needs the development networks (never in a
          # release image).
          build-args: NYM_FEATURES=dev-networks
          load: true
          cache-from: type=gha,scope=nym
          cache-to: type=gha,mode=max,scope=nym
      - name: Local mixnet image (nym-node 1.21.5, offline patch)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ci/nym-localnet
          file: ci/nym-localnet/Dockerfile
          tags: enclave-nym-localnet:ci
          load: true
          cache-from: type=gha,scope=localnet
          cache-to: type=gha,mode=max,scope=localnet
      - name: Host tools
        run: |
          cargo build --release --locked -p enclave-admin -p enclave-e2e
          # The SOCKS5 front a device puts Tor behind, dialling directly
          # here (no Tor network in CI).
          cargo build --release --locked -p enclave-tord --no-default-features --features dev-direct
          (cd nym && cargo build --release --locked -p enclave-nymd -p enclave-dev-proxy --features enclave-nymd/dev-networks \
            && cargo build --release --locked -p enclave-nym-sdk --example live_bench --features dev-networks)
      - name: Three stacks and a mixnet, one foundation
        run: TRANSPORT=nym ci/federation/gen.sh up
      - name: End to end over the mixnet through tord, with a restart of one stack
        run: TRANSPORT=nym TORD=$PWD/target/release/enclave-tord ci/federation/gen.sh e2e
      - name: Traffic shape, from a capture of the device's link to its gateway
        run: |
          command -v tcpdump >/dev/null || sudo apt-get install -y --no-install-recommends tcpdump
          TRANSPORT=nym TORD=$PWD/target/release/enclave-tord ci/federation/gen.sh shape
      - name: Mixnet path numbers (live_bench on the local mixnet)
        run: |
          TRANSPORT=nym ci/federation/gen.sh bench
          { echo '### live_bench, local mixnet'; echo '```json'; cat target/federation/bench.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: traffic-shape
          path: |
            target/federation/shape/
            target/federation/bench.json
          if-no-files-found: ignore
      - if: failure()
        run: TRANSPORT=nym ci/federation/gen.sh logs
      - if: always()
        run: TRANSPORT=nym ci/federation/gen.sh down

  release-features:
    name: release builds hold no development feature (X17)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            .
            nym
      # What ships on a device, built as a release builds it: default
      # features only. Each development feature puts an `ENCLAVE-DEV-…`
      # marker in the binary (the server image's build checks its own).
      - name: Install UI build dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libfontconfig1-dev libxkbcommon-dev libasound2-dev libpipewire-0.3-dev
      - name: Build the device binaries
        run: |
          cargo build --release --locked -p enclave-app -p enclave-netd -p enclave-vault -p enclave-tord -p enclave-mediad
          (cd nym && cargo build --release --locked -p enclave-nymd -p enclave-ingress-bin)
      - name: No development marker in them
        run: |
          set -euo pipefail
          bins="target/release/enclave target/release/enclave-netd target/release/enclave-vault target/release/enclave-tord
                target/release/enclave-mediad nym/target/release/enclave-nymd nym/target/release/enclave-ingress"
          found=0
          for b in $bins; do
            test -x "$b"
            if strings -a "$b" | grep -q 'ENCLAVE-DEV-'; then
              echo "::error::$b contains a development feature: $(strings -a "$b" | grep -o 'ENCLAVE-DEV-[A-Z-]*' | sort -u | tr '\n' ' ')"
              found=1
            fi
          done
          exit $found
      - name: Without the development transport, TCP routes are refused
        run: cargo test --release --locked -p enclave-net --lib release_build
      # And the markers are real: a development build has them.
      - name: The check would catch one
        run: |
          cargo build --release --locked -p enclave-tord --no-default-features --features dev-direct
          strings -a target/release/enclave-tord | grep -q ENCLAVE-DEV-DIRECT-ENABLED
          cargo build --release --locked -p enclave-vault --features demo
          strings -a target/release/enclave-vault | grep -q ENCLAVE-DEV-DEMO-ENABLED

  done-gate:
    name: completion gate (report)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # Reports what is left; becomes the blocking `cargo xtask done` at 1.0.
      - run: cargo xtask done --report | tee done-gate.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: done-gate
          path: done-gate.txt

  packaging:
    name: packaging files (desktop entry, AppStream, scripts, versions)
    runs-on: ubuntu-24.04
    outputs:
      changed: ${{ steps.changes.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Validate
        run: |
          set -euo pipefail
          sudo apt-get update && sudo apt-get install -y desktop-file-utils appstream shellcheck
          desktop-file-validate packaging/linux/com.aricummings.Enclave.desktop
          appstreamcli validate --no-net --explain packaging/linux/com.aricummings.Enclave.metainfo.xml
          shellcheck -x ci/release/*.sh ci/tor/*.sh packaging/linux/enclave
          bash -n packaging/aur/enclave-messenger/PKGBUILD packaging/aur/enclave-messenger-bin/PKGBUILD
          python3 -c "import plistlib, sys; [plistlib.load(open(f, 'rb')) for f in sys.argv[1:]]" packaging/macos/*.plist packaging/macos/*.entitlements
          cargo xtask version
          ci/release/manifest.sh "$(cargo xtask version)" | sort | uniq -d | (! grep .)
          python3 -c "import yaml, sys; yaml.safe_load(open(sys.argv[1]))" packaging/flatpak/com.aricummings.Enclave.yml
          ci/readme-compose.sh --check
          shellcheck ops/updater/update.sh ci/readme-compose.sh packaging/flatpak/flathub.sh
          (cd ops/compose && cp .env.example .env && docker compose config -q && rm .env)
      - id: changes
        name: Did packaging change? (then the release workflow runs as a dry run)
        env:
          BEFORE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          changed=true
          if git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            files=$(git diff --name-only "$BEFORE" HEAD)
            if ! echo "$files" | grep -Eq '^(packaging/|apps/|crates/enclave-mobile/|ci/release/|ci/tor/lyrebird\.sh|xtask/src/dist\.rs|\.github/workflows/release\.yml|crates/enclave-app/(build\.rs|Cargo\.toml)|ops/docker/|ops/updater/|ops/compose/compose\.yml)'; then
              changed=false
            fi
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "packaging changed: $changed"

  release-dry-run:
    name: release (dry run)
    needs: packaging
    if: needs.packaging.outputs.changed == 'true'
    # What release.yml's jobs ask for; a dry run signs, pushes and publishes
    # nothing.
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/release.yml
    with:
      dry_run: true
