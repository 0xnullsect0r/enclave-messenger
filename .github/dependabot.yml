version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    # One pull request a week for every crate update (each runs all of CI).
    groups:
      cargo:
        patterns: ["*"]
    open-pull-requests-limit: 2
